<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit or DIE!">
<meta name="theme-color" content="#12082b">
<title>Fit or DIE! 💀🔥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#12082b; --bg2:#2b1460; --ac:#ffd23f; --ac2:#ff8a3d;
  --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12); --line:rgba(255,255,255,.12);
  --tx:#f4f1ff; --tx2:rgba(244,241,255,.65); --tx3:rgba(244,241,255,.4);
  --me:#38b6ff; --ok:#3ddc84; --bad:#ff5757; --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  font-family:'Heebo',-apple-system,'Segoe UI',sans-serif;color:var(--tx);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg1) 100%) fixed;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:1em}
input,textarea,select{font-family:inherit;font-size:1em;color:var(--tx);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
img{max-width:100%}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 92px);min-height:100vh}
.center{text-align:center}
h2{font-size:1.15em;font-weight:800;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
.muted{color:var(--tx2);font-size:.85em}
.tiny{color:var(--tx3);font-size:.75em}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;font-weight:700;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1c1029;border:none;box-shadow:0 4px 18px rgba(255,180,60,.35)}
.btn.big{width:100%;padding:15px;font-size:1.1em;border-radius:16px}
.btn.danger{color:var(--bad);border-color:rgba(255,87,87,.4)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:999px;padding:4px 11px;font-size:.8em;font-weight:600}

/* ===== topbar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:900;font-size:1.35em;letter-spacing:.5px;background:linear-gradient(90deg,var(--ac),var(--ac2),#ff5757);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ver{font-size:.65em;color:var(--tx3);font-weight:600;margin-inline-start:6px}
.gear{font-size:1.3em;padding:6px}

/* ===== bottom nav ===== */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:space-around;align-items:flex-end;
  max-width:520px;margin:0 auto;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:rgba(14,7,34,.85);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.25em;color:var(--tx3);padding:4px 10px;flex:1}
.bnav button span{font-size:.5em;font-weight:700}
.bnav button.on{color:var(--ac)}
.bnav .fab{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#1c1029;font-size:2em;font-weight:900;display:flex;align-items:center;justify-content:center;
  margin-top:-26px;box-shadow:0 6px 20px rgba(255,180,60,.45);border:3px solid var(--bg1)}

/* ===== avatars ===== */
.ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.3);
  border:2.5px solid var(--c,#888);position:relative;flex:0 0 auto}
.ava.s1{width:34px;height:34px;font-size:1.05em}
.ava.s2{width:48px;height:48px;font-size:1.5em}
.ava.s3{width:74px;height:74px;font-size:2.4em}
.ava .lvl{position:absolute;bottom:-6px;inset-inline-end:-6px;font-size:.55em;background:var(--bg2);border-radius:999px;padding:1px 4px;border:1px solid var(--line)}

/* ===== home ===== */
.weekcard{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04))}
.ringwrap{position:relative;display:flex;align-items:center;justify-content:center}
.ringcenter{position:absolute;text-align:center}
.ringcenter b{font-size:1.5em;font-weight:900}
.daydots{display:flex;justify-content:space-between;margin-top:10px}
.daydot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7em;color:var(--tx3)}
.daydot i{width:13px;height:13px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-style:normal}
.daydot.on i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.6)}
.daydot.today{color:var(--ac)}
.gbar{height:20px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;display:flex;margin-top:8px}
.gbar i{height:100%;display:block}
.captainbtn{background:linear-gradient(135deg,#7c4dff,#b388ff);color:#fff;border:none;width:100%;padding:12px;border-radius:14px;font-weight:800;margin-bottom:12px;box-shadow:0 4px 16px rgba(124,77,255,.4)}

/* ===== checkin ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chips button{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:600;font-size:.92em}
.chips button.sel{border-color:var(--ac);background:rgba(255,210,63,.15);color:var(--ac);box-shadow:0 0 10px rgba(255,210,63,.25)}
.minrow{display:flex;gap:8px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
.minrow button{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:9px 0;font-weight:700;flex:1;min-width:52px}
.minrow button.sel{border-color:var(--ac);color:var(--ac);background:rgba(255,210,63,.15)}
.minrow input{width:74px;text-align:center;flex:0 0 auto}
.photoprev{width:100%;border-radius:12px;margin-top:8px}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:10px;padding-bottom:70px}
.fdate{text-align:center;font-size:.72em;color:var(--tx3);margin:6px 0 -2px;font-weight:600}
.fitem{max-width:88%}
.fitem.mine{margin-inline-start:auto}
.bubble{background:var(--card2);border-radius:16px;padding:9px 13px;border:1px solid var(--line)}
.fitem.mine .bubble{background:color-mix(in srgb,var(--me) 26%,rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--me) 45%,transparent)}
.fhead{display:flex;align-items:center;gap:7px;margin-bottom:3px;font-size:.78em;color:var(--tx2);font-weight:700}
.ftime{font-size:.68em;color:var(--tx3);margin-top:3px;text-align:end}
.fsys{text-align:center;font-size:.8em;color:var(--tx2);background:rgba(0,0,0,.22);border-radius:999px;padding:6px 14px;align-self:center;max-width:95%}
.ckcard{border-inline-start:4px solid var(--c,#888);background:var(--card);border-radius:14px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.ckcard .big{font-weight:800;font-size:1.02em}
.ckphoto{border-radius:12px;margin-top:8px;max-height:280px;object-fit:cover;width:100%}
.reacts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.reacts button{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.78em}
.reacts button.on{border-color:var(--ac);background:rgba(255,210,63,.16)}
.rpick{display:flex;gap:6px;background:rgba(0,0,0,.4);border-radius:999px;padding:5px 10px;margin-top:6px;width:max-content}
.rpick button{font-size:1.15em}
.msgbar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:0;right:0;max-width:520px;margin:0 auto;
  display:flex;gap:8px;padding:8px 14px;background:rgba(14,7,34,.9);backdrop-filter:blur(12px);z-index:40}
.msgbar input{flex:1;border-radius:999px}
.msgbar button{font-size:1.5em;color:var(--ac)}

/* ===== group ===== */
.mcard{display:flex;align-items:center;gap:12px}
.mbar{height:9px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:999px}
.medal{font-size:1.2em}

/* ===== profile ===== */
.xpbar{height:12px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:999px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.badge .e{font-size:1.7em}
.badge .n{font-size:.72em;font-weight:700;margin-top:3px}
.badge.locked{opacity:.35;filter:grayscale(1)}
.wbars{display:flex;align-items:flex-end;gap:6px;height:110px;position:relative;margin-top:8px}
.wbars .wb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.wbars .wb i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));min-height:2px}
.wbars .wb span{font-size:.62em;color:var(--tx3)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,255,255,.35);font-size:.6em;color:var(--tx3)}
.photoslot{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:var(--tx3);font-size:.8em;overflow:hidden;background:rgba(0,0,0,.2)}
.photoslot img{width:100%;height:100%;object-fit:cover}

/* ===== themes/colors pickers ===== */
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.themegrid button{border-radius:14px;padding:13px 6px;border:2px solid transparent;font-weight:700;font-size:.85em;color:#fff}
.themegrid button.sel{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0}
.emogrid button{font-size:1.6em;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:6px 0}
.emogrid button.sel{border-color:var(--ac)}
.colorrow{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0}
.colorrow button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colorrow button.sel{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.5)}

/* ===== auth/splash ===== */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px;text-align:center}
.splash .biglogo{font-size:2.3em;font-weight:900;background:linear-gradient(90deg,var(--ac),var(--ac2),#ff5757);-webkit-background-clip:text;background-clip:text;color:transparent}
.skull{font-size:3.5em;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--tx2)}
.tabs button.on{background:var(--card2);color:var(--tx)}
.field{margin-bottom:10px;text-align:start}
.field label{display:block;font-size:.8em;color:var(--tx2);font-weight:600;margin-bottom:4px}

/* ===== toasts / fx ===== */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(20,10,45,.95);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9em;
  box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .25s}
.toast.gold{border-color:var(--ac);color:var(--ac)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@keyframes tin{from{transform:translateY(-18px);opacity:0}}
.xppop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:110;font-size:2.6em;font-weight:900;color:var(--ac);
  text-shadow:0 0 24px rgba(255,210,63,.8);animation:xpp 1.4s forwards;pointer-events:none}
@keyframes xpp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
.confetto{position:fixed;top:-30px;z-index:105;font-size:1.5em;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.demobanner{background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);border-radius:12px;padding:7px 12px;font-size:.78em;color:var(--ac);margin-bottom:12px;text-align:center;font-weight:600}
.persona{display:flex;align-items:center;gap:12px;width:100%;text-align:start}
.steps li{margin:8px 0 8px 0;padding-inline-start:4px;color:var(--tx2);font-size:.9em}
.svgchart{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ============================================================
   Fit or DIE! 💀🔥 — אפליקציית אתגר כושר קבוצתי
   קובץ יחיד: HTML + CSS + JS. עברית RTL. ללא build.
   שני מצבי עבודה:
     - מצב הדגמה (DemoStore): נתונים מקומיים ב-localStorage, נטען
       אוטומטית כשאין הגדרות Firebase — לפיתוח והתרשמות.
     - מצב ענן (FireStore): Firebase Auth + Firestore, סנכרון חי
       בין המשתתפים. ראו SETUP-FIREBASE.md להקמה.
   ============================================================ */
const APP_VERSION = '0.1.0';

/* ==== הגדרות Firebase ====
   אחרי הקמת הפרויקט (ראה SETUP-FIREBASE.md) מדביקים כאן את
   אובייקט ההגדרות מקונסולת Firebase. כל עוד הערך null —
   האפליקציה עולה במצב הדגמה מקומי. */
const FIREBASE_CONFIG = null;
/* דוגמה:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "fit-or-die-xxxx.firebaseapp.com",
  projectId: "fit-or-die-xxxx", storageBucket: "...",
  messagingSenderId: "...", appId: "..."
};
*/

/* ===================== קבועים ===================== */
const ACTIVITIES = [
  {id:'walk', n:'הליכה', e:'🚶'}, {id:'run', n:'ריצה', e:'🏃'},
  {id:'gym', n:'חדר כושר', e:'🏋️'}, {id:'bike', n:'אופניים', e:'🚴'},
  {id:'swim', n:'שחייה', e:'🏊'}, {id:'ball', n:'משחק כדור', e:'⚽'},
  {id:'other', n:'אחר', e:'✨'}
];
const THEMES = [
  {id:'hero',    n:'גיבורי־על', bg1:'#12082b', bg2:'#2b1460', ac:'#ffd23f', ac2:'#ff8a3d'},
  {id:'fire',    n:'אש',        bg1:'#2b0a12', bg2:'#6e1e1e', ac:'#ffb020', ac2:'#ff5757'},
  {id:'ocean',   n:'אוקיינוס',  bg1:'#051c2b', bg2:'#0e4a6e', ac:'#38d6ff', ac2:'#3ddc84'},
  {id:'forest',  n:'יער',       bg1:'#0a2313', bg2:'#1e5a2e', ac:'#a8e05f', ac2:'#3ddc84'},
  {id:'galaxy',  n:'גלקסיה',    bg1:'#0d0a2b', bg2:'#42106e', ac:'#b388ff', ac2:'#ff7ab6'},
  {id:'sunrise', n:'זריחה',     bg1:'#2b1408', bg2:'#6e3a10', ac:'#ffd23f', ac2:'#ff7ab6'}
];
const LEVELS = [
  {xp:0,    n:'טירון',     e:'🐣'}, {xp:100,  n:'מתאמן',    e:'🥊'},
  {xp:250,  n:'לוחם',      e:'⚔️'}, {xp:450,  n:'סיירת',    e:'🎖️'},
  {xp:700,  n:'גיבור',     e:'🦸'}, {xp:1000, n:'גיבור־על', e:'⚡'},
  {xp:1400, n:'אגדה',      e:'🌟'}, {xp:2000, n:'אלוף־על',  e:'👑'}
];
const BADGES = [
  {id:'first',    n:'ראשון בשטח',   e:'🎬', d:'האימון הראשון שלך באתגר'},
  {id:'spread',   n:'מפוזר ומנצח',  e:'📅', d:'3 ימים פעילים או יותר בשבוע אחד'},
  {id:'perfect',  n:'שבוע מושלם',   e:'🏆', d:'עמידה ביעד הדקות השבועי'},
  {id:'streak7',  n:'על אש',        e:'🔥', d:'רצף 7 ימים פעילים ברציפות'},
  {id:'comeback', n:'הקאמבק',       e:'🦅', d:'חזרה לאימונים אחרי הפסקה של 5+ ימים'},
  {id:'photo',    n:'צלם בשטח',     e:'📸', d:'דיווח ראשון עם תמונה'}
];
const HERO_EMOJIS = ['🦸‍♂️','🦸‍♀️','🦹‍♂️','🦹‍♀️','🥷','🤖','🦁','🐆','🦅','⚡','🔥','💪'];
const MEMBER_COLORS = ['#ff5757','#ffb020','#3ddc84','#38b6ff','#b388ff','#ff7ab6','#2dd4bf','#f97316'];
const REACTIONS = ['❤️','🔥','💪','👏','😂'];  // נשמרות לפי אינדקס: r0..r4
const DAY_LETTERS = ['א','ב','ג','ד','ה','ו','ש'];
const GOAL_MIN_RANGE = [60, 300];   // טווח היעד השבועי שהקפטן יכול לקבוע
const MIN_WORKOUT = 10;             // דקות מינימום לאימון שנספר

/* ===================== עזרי בסיס ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function dayKey(d) { d = d || new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function sundayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); }
function fmtDate(ts) {
  const d = new Date(ts), today = dayKey(), k = dayKey(d);
  if (k === today) return 'היום';
  if (daysBetween(k, today) === 1) return 'אתמול';
  return d.toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'numeric'});
}
function levelIndex(xp) { let i = 0; for (let j = 0; j < LEVELS.length; j++) if (xp >= LEVELS[j].xp) i = j; return i; }
function themeById(id) { return THEMES.find(t => t.id === id) || THEMES[0]; }
function actById(id) { return ACTIVITIES.find(a => a.id === id) || ACTIVITIES[ACTIVITIES.length-1]; }
function badgeById(id) { return BADGES.find(b => b.id === id); }

function showToast(txt, cls) {
  const t = document.createElement('div');
  t.className = 'toast ' + (cls || '');
  t.textContent = txt;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, 2400);
  setTimeout(() => t.remove(), 2900);
}
function xpPop(n) {
  const e = document.createElement('div');
  e.className = 'xppop';
  e.textContent = '+' + n + ' XP 💥';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 1500);
}
function confetti() {
  const emo = ['🎉','⭐','💥','🔥','🏆','✨'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('div');
    c.className = 'confetto';
    c.textContent = emo[i % emo.length];
    c.style.left = (Math.random()*100) + 'vw';
    c.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*.5) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

/* דחיסת תמונה בצד לקוח ל-JPEG data URL (עד ~250KB) */
async function compressImage(file, maxDim) {
  maxDim = maxDim || 900;
  let bmp = null;
  try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = rej; img.src = url;
    });
  }
  const w = bmp.width, h = bmp.height, sc = Math.min(1, maxDim / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.72, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 250 * 1365 && q > 0.35) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); } // ‎~250KB base64
  return out;
}

/* ===================== חישובי שבוע ===================== */
function curWeek() {
  if (!state.challenge) return 0;
  const n = Math.floor(daysBetween(state.challenge.startDate, dayKey()) / 7);
  return Math.max(0, Math.min(n, state.challenge.weeksTotal - 1));
}
function weekInfo(n) {
  const ch = state.challenge, saved = state.weeks[n] || {};
  const order = ch.captainOrder && ch.captainOrder.length ? ch.captainOrder : Object.keys(state.members);
  return {
    n,
    captainUid: saved.captainUid || order[n % order.length],
    goalMin: saved.goalMin || ch.defaultGoalMin,
    theme: saved.theme || THEMES[n % THEMES.length].id,  // ברירת מחדל: ערכת נושא מתחלפת כל שבוע
    bonus: saved.bonus || '',
    groupBonusDone: !!saved.groupBonusDone,
  };
}
function memberWeek(m, n) { return (m.weekStats && m.weekStats[n]) || {min:0, daysArr:[], goalBonus:false, spreadBonus:false, bonusClaim:false}; }
function groupWeekMin(n) { return Object.values(state.members).reduce((s, m) => s + memberWeek(m, n).min, 0); }
function daysLeftInWeek() {
  const end = Date.parse(state.challenge.startDate) + (curWeek()+1) * 7 * 864e5;
  return Math.max(0, Math.ceil((end - Date.now()) / 864e5));
}

/* ===================== מנוע המשחוק =====================
   פונקציה טהורה: מקבלת עותק של משתתף + דיווח, מחזירה משתתף
   מעודכן, XP שהתקבל ורשימת אירועים (תג/דרגה/בונוס). משמשת גם
   את מצב ההדגמה וגם את מצב הענן — מקור אמת אחד לחוקים. */
function applyCheckin(member, weekN, weekGoal, checkin) {
  const m = JSON.parse(JSON.stringify(member));
  m.badges = m.badges || []; m.weekStats = m.weekStats || {};
  const ws = m.weekStats[weekN] = Object.assign({min:0, daysArr:[], goalBonus:false, spreadBonus:false, bonusClaim:false}, m.weekStats[weekN]);
  const day = checkin.day, events = [];
  let xp = 10 + Math.floor(checkin.minutes / 5);

  if (m.lastActiveDay !== day) {                      // יום פעיל חדש → רצף
    const gap = m.lastActiveDay ? daysBetween(m.lastActiveDay, day) : null;
    if (gap === 1) m.streakDays = (m.streakDays || 0) + 1;
    else {
      if (gap != null && gap >= 5 && !m.badges.includes('comeback')) { m.badges.push('comeback'); events.push({t:'badge', id:'comeback'}); }
      m.streakDays = 1;
    }
    m.lastActiveDay = day;
    xp += 5 * Math.min(m.streakDays, 7);
    if (m.streakDays === 7 && !m.badges.includes('streak7')) { m.badges.push('streak7'); events.push({t:'badge', id:'streak7'}); }
  }
  if (!ws.daysArr.includes(day)) ws.daysArr.push(day);
  ws.min += checkin.minutes;

  if (!m.badges.includes('first')) { m.badges.push('first'); events.push({t:'badge', id:'first'}); }
  if (checkin.photo && !m.badges.includes('photo')) { m.badges.push('photo'); events.push({t:'badge', id:'photo'}); }
  if (ws.daysArr.length >= 3 && !ws.spreadBonus) { ws.spreadBonus = true; xp += 20; events.push({t:'bonus', txt:'3 ימים פעילים השבוע! +20'}); }
  if (ws.min >= weekGoal && !ws.goalBonus) {
    ws.goalBonus = true; xp += 50; events.push({t:'bonus', txt:'עמידה ביעד השבועי! +50'});
    if (!m.badges.includes('perfect')) { m.badges.push('perfect'); events.push({t:'badge', id:'perfect'}); }
  }
  const lvBefore = levelIndex(m.xp || 0);
  m.xp = (m.xp || 0) + xp;
  if (levelIndex(m.xp) > lvBefore) events.push({t:'level', lv: levelIndex(m.xp)});
  return {m, xp, events};
}
/* אירועי מנוע → פריטי פיד מערכתיים + טוסטים (ניסוח ניטרלי-מגדרית) */
function eventFeedText(name, ev) {
  if (ev.t === 'level') return '🎉 דרגה חדשה ל' + name + ': ' + LEVELS[ev.lv].n + ' ' + LEVELS[ev.lv].e + '!';
  if (ev.t === 'badge') { const b = badgeById(ev.id); return b.e + ' תג חדש ל' + name + ': "' + b.n + '"!'; }
  return null;
}

  async boot() {

    const groupBefore = groupWeekMin(w);
    const res = applyCheckin(state.members[state.me], w, wi.goalMin, c);
    const b = this.db.batch();
    const mRef = this.chRef().collection('members').doc(state.me);
    b.update(mRef, {xp: res.m.xp, badges: res.m.badges, streakDays: res.m.streakDays,
      lastActiveDay: res.m.lastActiveDay, ['weekStats.' + w]: res.m.weekStats[w]});
    b.set(this.chRef().collection('feed').doc(), {type:'checkin', uid: state.me, ts: Date.now(), week: w,
      activity: c.activity, minutes: c.minutes, text: c.note || '', photo: c.photo || null, reactions:{}});
    res.events.forEach(ev => {
      const txt = eventFeedText(res.m.name, ev);
      if (txt) b.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+1, text: txt, reactions:{}});
    });
    await b.commit();
    // בונוס קבוצתי בטרנזקציה — פעם אחת בלבד לשבוע
    const groupGoal = wi.goalMin * Object.keys(state.members).length;
    if (!wi.groupBonusDone && groupBefore < groupGoal && groupBefore + c.minutes >= groupGoal) {
      const wRef = this.chRef().collection('weeks').doc(String(w));
      try {
        await this.db.runTransaction(async tx => {
          const wd = await tx.get(wRef);
          if (wd.exists && wd.data().groupBonusDone) return;
          tx.set(wRef, {groupBonusDone: true}, {merge: true});
        });
        const b2 = this.db.batch();
        Object.keys(state.members).forEach(uid =>
          b2.update(this.chRef().collection('members').doc(uid), {xp: this.FV.increment(30)}));
        b2.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+2,
          text:'🏆 הקבוצה עמדה ביעד השבועי! +30 XP לכל אחד!', reactions:{}});
        await b2.commit();
        res.events.push({t:'group'});
      } catch (e) {}
    }
    return res;
  },
  async sendMsg(text) {
    await this.chRef().collection('feed').add({type:'msg', uid: state.me, ts: Date.now(), text, reactions:{}});
  },
  async react(fid, ri) {
    const it = state.feed.find(f => f.id === fid); if (!it) return;
    const arr = ((it.reactions || {})['r'+ri] || []).slice();
    const i = arr.indexOf(state.me);
    if (i >= 0) arr.splice(i, 1); else arr.push(state.me);
    await this.chRef().collection('feed').doc(fid).update({['reactions.r'+ri]: arr});
  },
  async setWeekPlan(n, plan) {
    await this.chRef().collection('weeks').doc(String(n)).set(plan, {merge: true});
    const me = state.members[state.me];
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(),
      text:'⚡ ' + me.name + ' — תוכנית השבוע: יעד ' + plan.goalMin + ' דק\' · נושא "' + themeById(plan.theme).n + '"' + (plan.bonus ? ' · משימת בונוס: ' + plan.bonus : ''), reactions:{}});
  },
  async claimBonus() {
    const w = curWeek(), m = state.members[state.me];
    const ws = Object.assign({min:0, daysArr:[], goalBonus:false, spreadBonus:false, bonusClaim:false}, memberWeek(m, w));
    if (ws.bonusClaim) return false;
    ws.bonusClaim = true;
    await this.chRef().collection('members').doc(state.me).update({['weekStats.' + w]: ws, xp: this.FV.increment(20)});
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(), text:'🎯 משימת הבונוס הושלמה — ' + m.name + ' +20 XP', reactions:{}});
    return true;
  },
  async saveProfile(patch) { await this.chRef().collection('members').doc(state.me).update(patch); },
  async savePrivate(patch) { await this.chRef().collection('members').doc(state.me).collection('private').doc('data').set(patch, {merge: true}); },
  async addWeighIn(kg) {
    await this.chRef().collection('members').doc(state.me).collection('private').doc('data')
      .set({weighIns: this.FV.arrayUnion({date: dayKey(), kg})}, {merge: true});
  },
};

function applyTheme() {
  if (!state.challenge) return;
  const t = themeById(weekInfo(curWeek()).theme);
  const r = document.documentElement.style;
  r.setProperty('--bg1', t.bg1); r.setProperty('--bg2', t.bg2);
  r.setProperty('--ac', t.ac); r.setProperty('--ac2', t.ac2);
  const me = state.members[state.me];
  if (me) r.setProperty('--me', me.color);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = t.bg1;
}

function ringHTML(pct, size, stroke, color, centerHTML) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(pct, 1));
  return '<div class="ringwrap" style="width:' + size + 'px;height:' + size + 'px">' +
    '<svg width="' + size + '" height="' + size + '"><circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke="rgba(255,255,255,.1)" stroke-width="' + stroke + '" fill="none"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke="' + color + '" stroke-width="' + stroke + '" fill="none" stroke-linecap="round" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')" style="transition:stroke-dashoffset .8s"/></svg>' +
    '<div class="ringcenter">' + centerHTML + '</div></div>';
}

    return '<button class="' + (arr.includes(state.me)?'on':'') + '" onclick="doReact(\'' + f.id + '\',' + i + ')">' + e + ' ' + arr.length + '</button>';
  }).join('');
  const picker = state.reactFor === f.id

    // תמונות לפני/יעד — פרטי

      (p.photoGoal ? '<img src="' + p.photoGoal + '">' : '🎯 תמונת השראה') + '</div><div class="tiny center" style="margin-top:4px">לאן שואפים</div></div></div>' +
      '<input id="phStart" type="file" accept="image/*" style="display:none" onchange="privPhoto(this,\'photoStart\')">' +
      '<input id="phGoal" type="file" accept="image/*" style="display:none" onchange="privPhoto(this,\'photoGoal\')"></div>';

function weightChartSVG(p, wis) {
  const W = 340, H = 150, pad = 26;
  const vals = wis.map(w => w.kg).concat(p.goalWeight ? [p.goalWeight] : []).concat(p.startWeight ? [p.startWeight] : []);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 2) { mn -= 1; mx += 1; }
  const X = i => pad + (W - 2*pad) * (wis.length === 1 ? .5 : i / (wis.length - 1));
  const Y = v => H - pad - (H - 2*pad) * ((v - mn) / (mx - mn));
  const pts = wis.map((w, i) => X(i) + ',' + Y(w.kg)).join(' ');
  return '<svg class="svgchart" viewBox="0 0 ' + W + ' ' + H + '">' +
    (p.goalWeight ? '<line x1="' + pad + '" y1="' + Y(p.goalWeight) + '" x2="' + (W-pad) + '" y2="' + Y(p.goalWeight) + '" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.5" opacity=".7"/>' +
      '<text x="' + (W-pad) + '" y="' + (Y(p.goalWeight)-5) + '" fill="var(--ok)" font-size="10" text-anchor="end">יעד ' + p.goalWeight + '</text>' : '') +
    '<polyline points="' + pts + '" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>' +
    wis.map((w, i) => '<circle cx="' + X(i) + '" cy="' + Y(w.kg) + '" r="4" fill="var(--ac)"/>' +
      '<text x="' + X(i) + '" y="' + (Y(w.kg) - 9) + '" fill="var(--tx2)" font-size="10" text-anchor="middle">' + w.kg + '</text>').join('') +
    '</svg>';
}

function render() {

  let h;
  if (state.booting) h = splashHTML();
  else if (v === 'auth') h = authViewHTML();
  else if (v === 'join') h = joinViewHTML();
  else if (v === 'onboard') h = onboardHTML();
  else if (v === 'pickuser') h = pickUserHTML();
  else if (v === 'neterror') h = netErrorHTML();
  else if (!state.challenge || !state.members[state.me]) h = splashHTML();
  else if (v === 'checkin') h = checkinHTML();
  else if (v === 'feed') h = feedHTML();
  else if (v === 'group') h = groupHTML();
  else if (v === 'profile') h = profileHTML();
  else if (v === 'captain') h = captainHTML();
  else if (v === 'settings') h = settingsHTML();
  else h = homeHTML();
  $('app').innerHTML = h;

function nav(v) {
  state.reactFor = null;

  if (v === 'captain') state.weekDraft = null;

}

function setAuthTab(t) { state.authTab = t; render(); }
function setJoinTab(t) { state.joinTab = t; render(); }
async function doAuth() {
  const email = $('authEmail').value.trim(), pass = $('authPass').value;
  if (!email || pass.length < 6) { showToast('נא למלא אימייל וסיסמה (6+ תווים)', 'bad'); return; }
  state.authBusy = true; render();
  try {
    if (state.authTab === 'login') await Store.signIn(email, pass);
    else await Store.signUp(email, pass);
  } catch (e) {
    const msgs = {'auth/invalid-credential':'אימייל או סיסמה שגויים', 'auth/wrong-password':'סיסמה שגויה',
      'auth/user-not-found':'לא קיים חשבון — נסו הרשמה', 'auth/email-already-in-use':'האימייל כבר רשום — נסו התחברות',
      'auth/invalid-email':'כתובת אימייל לא תקינה', 'auth/weak-password':'הסיסמה חלשה מדי'};
    showToast(msgs[e.code] || ('שגיאה: ' + e.message), 'bad');
  }
  state.authBusy = false; render();
}
async function doJoin() {
  const code = $('joinCode').value.trim();
  if (!code) { showToast('נא להזין קוד הזמנה', 'bad'); return; }
  try { await Store.joinByCode(code); } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doCreate() {
  const f = {name: $('chName').value.trim(), code: $('chCode').value.trim(),
    weeks: parseInt($('chWeeks').value) || 12, goal: parseInt($('chGoal').value) || 150};
  if (!f.name || f.code.length < 3) { showToast('נא למלא שם וקוד (3+ תווים)', 'bad'); return; }
  f.goal = Math.max(GOAL_MIN_RANGE[0], Math.min(GOAL_MIN_RANGE[1], f.goal));
  try { await Store.createChallenge(f); } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}

function syncEditInputs() {
  const n1 = $('obName'), n2 = $('setName');

  if (n2) state.editProfile.name = n2.value;

async function doOnboard() {
  syncEditInputs();
  const d = state.editProfile;
  if (!d.name.trim()) { showToast('איך קוראים לך? 🙂', 'bad'); return; }
  const priv = {};
  if (parseFloat(d.startWeight)) { priv.startWeight = parseFloat(d.startWeight); priv.weighIns = [{date: dayKey(), kg: parseFloat(d.startWeight)}]; }
  if (parseFloat(d.goalWeight)) priv.goalWeight = parseFloat(d.goalWeight);
  try {
    await Store.completeOnboard({name: d.name.trim(), emoji: d.emoji, color: d.color}, Object.keys(priv).length ? priv : null);
    showToast('ברוך הבא לאתגר! 🎉', 'gold');

}

async function doCheckin() {

  if (!d.minutes || d.minutes < MIN_WORKOUT) { showToast('אימון נספר מ-' + MIN_WORKOUT + ' דקות ומעלה 💪', 'bad'); return; }
  try {
    const res = await Store.checkin({activity: d.activity, minutes: d.minutes, note, photo: d.photo, day: dayKey()});
    state.draft = null; state.view = 'home';
    if (state.mode === 'demo') render();
    applyTheme(); render();
    xpPop(res.xp);
    res.events.forEach((ev, i) => setTimeout(() => {
      if (ev.t === 'badge') { const b = badgeById(ev.id); showToast(b.e + ' תג חדש: ' + b.n + '!', 'gold'); }
      if (ev.t === 'level') showToast('🎉 עלית לדרגת ' + LEVELS[ev.lv].n + '!', 'gold');
      if (ev.t === 'bonus') showToast('⭐ ' + ev.txt, 'gold');
      if (ev.t === 'group') showToast('🏆 הקבוצה עמדה ביעד! +30 לכולם', 'gold');
    }, 600 + i * 900));
    if (res.events.some(ev => ev.t === 'bonus' || ev.t === 'level' || ev.t === 'group')) confetti();
  } catch (e) { showToast('שגיאה בשמירה: ' + e.message, 'bad'); }
}

async function doSetWeights() {
  const s = parseFloat(prompt('משקל התחלה (ק"ג):'));
  const g = parseFloat(prompt('משקל יעד (ק"ג):'));
  const patch = {};
  if (s) { patch.startWeight = s; }
  if (g) patch.goalWeight = g;
  if (!Object.keys(patch).length) return;
  await Store.savePrivate(patch);
  if (s && !(state.priv.weighIns || []).length) await Store.addWeighIn(s);
  if (state.mode === 'demo') render();
}
async function privPhoto(inp, key) {
  if (!inp.files || !inp.files[0]) return;
  showToast('מכווץ תמונה... 📷');
  try {
    const data = await compressImage(inp.files[0], 700);
    const patch = {}; patch[key] = data;
    await Store.savePrivate(patch);
    if (state.mode === 'demo') render();
  } catch (e) { showToast('לא הצלחנו לקרוא את התמונה', 'bad'); }
}
function viewPhoto(fid) {
  const f = state.feed.find(x => x.id === fid);
  if (!f || !f.photo) return;
  const w = window.open('');
  if (w) w.document.write('<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="' + f.photo + '" style="max-width:100%;max-height:100vh"></body>');
}

/* ===================== אתחול ===================== */
window.addEventListener('error', e => { if (!state.booting) showToast('שגיאה: ' + (e.message || '').slice(0, 80), 'bad'); });
(async function boot() {
  Store = FIREBASE_CONFIG ? FireStore : DemoStore;
  render();
  await Store.boot();
  applyTheme();
  render();
})();
</script>
</body>
</html>
