<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit or DIE!">
<meta name="theme-color" content="#12082b">
<title>Fit or DIE! 💀🔥</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#12082b; --bg2:#2b1460; --ac:#ffd23f; --ac2:#ff8a3d;
  --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.12); --line:rgba(255,255,255,.12);
  --tx:#f4f1ff; --tx2:rgba(244,241,255,.65); --tx3:rgba(244,241,255,.4);
  --me:#38b6ff; --ok:#3ddc84; --bad:#ff5757; --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  font-family:'Heebo',-apple-system,'Segoe UI',sans-serif;color:var(--tx);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg1) 100%) fixed;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:1em}
input,textarea,select{font-family:inherit;font-size:1em;color:var(--tx);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
img{max-width:100%}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 92px);min-height:100vh}
.center{text-align:center}
h2{font-size:1.15em;font-weight:800;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
.muted{color:var(--tx2);font-size:.85em}
.tiny{color:var(--tx3);font-size:.75em}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;font-weight:700;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1c1029;border:none;box-shadow:0 4px 18px rgba(255,180,60,.35)}
.btn.big{display:flex;width:100%;padding:15px;font-size:1.1em;border-radius:16px}
.btn.danger{color:var(--bad);border-color:rgba(255,87,87,.4)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:999px;padding:4px 11px;font-size:.8em;font-weight:600}

/* ===== topbar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:900;font-size:1.35em;letter-spacing:.5px;background:linear-gradient(90deg,var(--ac),var(--ac2),#ff5757);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ver{font-size:.65em;color:var(--tx3);font-weight:600;margin-inline-start:6px}
.gear{font-size:1.3em;padding:6px}

/* ===== bottom nav ===== */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:space-around;align-items:flex-end;
  max-width:520px;margin:0 auto;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:rgba(14,7,34,.85);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.15em;color:var(--tx3);padding:4px 3px;flex:1;min-width:0}
.bnav button span{font-size:.5em;font-weight:700}
.bnav button.on{color:var(--ac)}
.bnav .fab{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#1c1029;font-size:2em;font-weight:900;display:flex;align-items:center;justify-content:center;
  margin-top:-26px;box-shadow:0 6px 20px rgba(255,180,60,.45);border:3px solid var(--bg1)}

/* ===== avatars ===== */
.ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.3);
  border:2.5px solid var(--c,#888);position:relative;flex:0 0 auto}
.ava.s1{width:34px;height:34px;font-size:1.05em}
.ava.s2{width:48px;height:48px;font-size:1.5em}
.ava.s3{width:74px;height:74px;font-size:2.4em}
.ava .lvl{position:absolute;bottom:-6px;inset-inline-end:-6px;font-size:.55em;background:var(--bg2);border-radius:999px;padding:1px 4px;border:1px solid var(--line)}

/* ===== home ===== */
.weekcard{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04))}
.ringwrap{position:relative;display:flex;align-items:center;justify-content:center}
.ringcenter{position:absolute;text-align:center}
.ringcenter b{font-size:1.5em;font-weight:900}
.daydots{display:flex;justify-content:space-between;margin-top:10px}
.daydot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7em;color:var(--tx3)}
.daydot i{width:13px;height:13px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-style:normal}
.daydot.on i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.6)}
.daydot.today{color:var(--ac)}
.gbar{height:20px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;display:flex;margin-top:8px}
.gbar i{height:100%;display:block}
.captainbtn{background:linear-gradient(135deg,#7c4dff,#b388ff);color:#fff;border:none;width:100%;padding:12px;border-radius:14px;font-weight:800;margin-bottom:12px;box-shadow:0 4px 16px rgba(124,77,255,.4)}

/* ===== checkin ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chips button{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:600;font-size:.92em}
.chips button.sel{border-color:var(--ac);background:rgba(255,210,63,.15);color:var(--ac);box-shadow:0 0 10px rgba(255,210,63,.25)}
.minrow{display:flex;gap:8px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
.minrow button{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:9px 0;font-weight:700;flex:1;min-width:52px}
.minrow button.sel{border-color:var(--ac);color:var(--ac);background:rgba(255,210,63,.15)}
.minrow input{width:74px;text-align:center;flex:0 0 auto}
.photoprev{width:100%;border-radius:12px;margin-top:8px}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:10px;padding-bottom:70px}
.fdate{text-align:center;font-size:.72em;color:var(--tx3);margin:6px 0 -2px;font-weight:600}
.fitem{max-width:88%}
.fitem.mine{margin-inline-start:auto}
.bubble{background:var(--card2);border-radius:16px;padding:9px 13px;border:1px solid var(--line)}
.fitem.mine .bubble{background:color-mix(in srgb,var(--me) 26%,rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--me) 45%,transparent)}
.fhead{display:flex;align-items:center;gap:7px;margin-bottom:3px;font-size:.78em;color:var(--tx2);font-weight:700}
.ftime{font-size:.68em;color:var(--tx3);margin-top:3px;text-align:end}
.fsys{text-align:center;font-size:.8em;color:var(--tx2);background:rgba(0,0,0,.22);border-radius:999px;padding:6px 14px;align-self:center;max-width:95%}
.ckcard{border-inline-start:4px solid var(--c,#888);background:var(--card);border-radius:14px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.ckcard .big{font-weight:800;font-size:1.02em}
.ckphoto{border-radius:12px;margin-top:8px;max-height:280px;object-fit:cover;width:100%}
.reacts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.reacts button{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.78em}
.reacts button.on{border-color:var(--ac);background:rgba(255,210,63,.16)}
.rpick{display:flex;gap:6px;background:rgba(0,0,0,.4);border-radius:999px;padding:5px 10px;margin-top:6px;width:max-content}
.rpick button{font-size:1.15em}
.msgbar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:0;right:0;max-width:520px;margin:0 auto;
  display:flex;gap:8px;padding:8px 14px;background:rgba(14,7,34,.9);backdrop-filter:blur(12px);z-index:40}
.msgbar input{flex:1;border-radius:999px}
.msgbar button{font-size:1.5em;color:var(--ac)}

/* ===== group ===== */
.mcard{display:flex;align-items:center;gap:12px}
.mbar{height:9px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:999px}
.medal{font-size:1.2em}

/* ===== profile ===== */
.xpbar{height:12px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:999px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.badge .e{font-size:1.7em}
.badge .n{font-size:.72em;font-weight:700;margin-top:3px}
.badge.locked{opacity:.35;filter:grayscale(1)}
.wbars{display:flex;align-items:flex-end;gap:6px;height:110px;position:relative;margin-top:8px}
.wbars .wb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.wbars .wb i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));min-height:2px}
.wbars .wb span{font-size:.62em;color:var(--tx3)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,255,255,.35);font-size:.6em;color:var(--tx3)}
.photoslot{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:var(--tx3);font-size:.8em;overflow:hidden;background:rgba(0,0,0,.2)}
.photoslot img{width:100%;height:100%;object-fit:cover}
.delx{position:absolute;top:-8px;inset-inline-end:-8px;width:28px;height:28px;border-radius:50%;background:var(--bad);
  color:#fff;font-weight:900;font-size:.85em;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.5);z-index:3}

/* ===== themes/colors pickers ===== */
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.themegrid button{border-radius:14px;padding:13px 6px;border:2px solid transparent;font-weight:700;font-size:.85em;color:#fff}
.themegrid button.sel{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0}
.emogrid button{font-size:1.6em;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:6px 0}
.emogrid button.sel{border-color:var(--ac)}
.colorrow{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0}
.colorrow button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colorrow button.sel{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.5)}

/* ===== auth/splash ===== */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px;text-align:center}
.splash .biglogo{font-size:2.3em;font-weight:900;background:linear-gradient(90deg,var(--ac),var(--ac2),#ff5757);-webkit-background-clip:text;background-clip:text;color:transparent}
.skull{font-size:3.5em;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--tx2)}
.tabs button.on{background:var(--card2);color:var(--tx)}
.field{margin-bottom:10px;text-align:start}
.field label{display:block;font-size:.8em;color:var(--tx2);font-weight:600;margin-bottom:4px}

/* ===== toasts / fx ===== */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:rgba(20,10,45,.95);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9em;
  box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .25s}
.toast.gold{border-color:var(--ac);color:var(--ac)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@keyframes tin{from{transform:translateY(-18px);opacity:0}}
.xppop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:110;font-size:2.6em;font-weight:900;color:var(--ac);
  text-shadow:0 0 24px rgba(255,210,63,.8);animation:xpp 1.4s forwards;pointer-events:none}
@keyframes xpp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
.confetto{position:fixed;top:-30px;z-index:105;font-size:1.5em;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.demobanner{background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);border-radius:12px;padding:7px 12px;font-size:.78em;color:var(--ac);margin-bottom:12px;text-align:center;font-weight:600}
.persona{display:flex;align-items:center;gap:12px;width:100%;text-align:start}
.steps li{margin:8px 0 8px 0;padding-inline-start:4px;color:var(--tx2);font-size:.9em}
.svgchart{width:100%;height:auto;display:block}
.hero{animation:heroFloat 3.4s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.herowrap{display:flex;justify-content:center}
/* ===== גיליון תחתון, לייטבוקס, נקודת "חדש" (v0.3) ===== */
.sheetback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
.sheet{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:61;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:sheetup .25s}
@keyframes sheetup{from{transform:translateY(40%);opacity:.4}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:10px}
.bnav button{position:relative}
.bnav .navdot{position:absolute;top:1px;inset-inline-end:18%;width:9px;height:9px;border-radius:50%;background:var(--bad);border:1.5px solid var(--bg1)}
.daydot.plan i{background:rgba(255,210,63,.12);border:2px dashed var(--ac)}
.daydot.miss i{background:transparent;border:2px solid rgba(255,87,87,.55)}
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.avgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card2);border:2px solid transparent;border-radius:14px;padding:8px 2px 6px;font-size:.72em;font-weight:700}
.avgrid button.sel{border-color:var(--ac);background:rgba(255,210,63,.12)}
.avgrid .hero{animation:none}
.chip.sel{border:1.5px solid var(--ac);color:var(--ac);background:rgba(255,210,63,.14)}
.wkhist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
/* דיוקן דמות מותאם (תמונת AI) במסגרת קלף לפי נדירות */
.heroimg{display:inline-block;position:relative;border:3.5px solid;border-radius:18px;overflow:visible;background:rgba(0,0,0,.25)}
.heroimg img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.heroimg .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:1.3em}
/* החיה המלווה — תג פינתי צמוד לדמות (לא גוזל רוחב, נראה טוב גם בטלפון) */
.duo{position:relative;display:inline-block;line-height:0}
.petbadge{position:absolute;bottom:-6px;inset-inline-start:-10px;border-radius:12px;border:2.5px solid var(--ac);
  overflow:hidden;background:#160c2e;box-shadow:0 3px 10px rgba(0,0,0,.5);z-index:2}
.petbadge img{width:100%;height:100%;object-fit:cover;display:block}
.petbadge .plv{position:absolute;bottom:0;left:0;right:0;background:rgba(10,5,25,.82);font-size:9px;line-height:12px;
  font-weight:800;text-align:center;color:var(--ac)}
.backbtn{font-size:1.35em;padding:4px 8px;line-height:1}

/* ===== דף הדמות (RPG) ===== */
.statrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.statrow b{width:74px;font-size:.86em;font-weight:700}
.statrow .val{width:26px;text-align:center;font-weight:900;font-size:1.02em;color:var(--ac)}
.statbar{flex:1;height:9px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden}
.statbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.gearg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
.gitem{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.26);border:1.5px solid var(--line);border-radius:13px;padding:8px 9px}
.gitem .ic{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:1.2em;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.gitem .nm{font-size:.78em;font-weight:700;line-height:1.25}
.gitem .pl{font-size:.72em;font-weight:900}
.gitem.locked{opacity:.4}
.abil{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:.87em}
.abil:last-child{border-bottom:none}
.abil .lvtag{margin-inline-start:auto;font-size:.72em;color:var(--tx3)}
.abil.on{color:var(--tx)}
.abil.off{opacity:.45}
.petcard{display:flex;align-items:center;gap:12px}
.petimg{width:86px;height:86px;flex:0 0 auto;border-radius:16px;border:3px solid var(--ac);object-fit:cover;background:rgba(0,0,0,.25)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.pgrid button{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:5px 2px 4px;font-size:.68em;font-weight:700}
.pgrid button img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;margin-bottom:2px}
.pgrid button.sel{border-color:var(--ac);background:rgba(255,210,63,.13)}
.pgrid button.lock{opacity:.4}
.clsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.clsgrid button{background:var(--card2);border:2.5px solid transparent;border-radius:14px;padding:0 0 5px;font-size:.72em;font-weight:700;overflow:hidden}
.clsgrid button img{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-bottom:3px}
.clsgrid button.sel{border-color:var(--ac);box-shadow:0 0 12px rgba(255,210,63,.35)}

/* ===== התאמה למסך מחשב (v0.5) =====
   מסכי הכרטיסים נפרסים לשתי עמודות; הצ'אט נשאר עמודה קריאה. */
@media (min-width: 900px) {
  #app{max-width:1024px}
  body[data-view=feed] #app{max-width:700px}
  body[data-view=checkin] #app, body[data-view=auth] #app, body[data-view=join] #app,
  body[data-view=onboard] #app, body[data-view=captain] #app, body[data-view=pickuser] #app{max-width:620px}
  body[data-view=home] #app, body[data-view=group] #app, body[data-view=panel] #app,
  body[data-view=profile] #app, body[data-view=settings] #app{column-count:2;column-gap:18px}
  .card{break-inside:avoid}

/* שינה: מינימום 7 שע' ללילה, 8 = מצוין. נספרות עד 8 שע' ללילה (יותר לא תורם).
   יעד שבועי אישי: 49 שע' (7×7); 56 = שבוע שינה מושלם. יעד קבוצתי: 49 × מספר המשתתפים. */
const SLEEP_NIGHT_MIN = 7;
const SLEEP_NIGHT_MAX = 8;
const SLEEP_WEEK_GOAL = 49;
const CHEAT_XP_STEP = 2000;   // כל 2000 XP קבוצתי מזכה בפאנל CHEAT 🍕

/* ===================== עזרי בסיס ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function dayKey(d) { d = d || new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function addDaysKey(dk, n) { return new Date(Date.parse(dk) + n * 864e5).toISOString().slice(0, 10); }
function sundayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
/* יום ראשון הקרוב (היום, אם היום ראשון) — ברירת המחדל לפתיחת אתגר */
function nextSunday() { const t = new Date(); const x = new Date(t.getFullYear(), t.getMonth(), t.getDate()); if (x.getDay() !== 0) x.setDate(x.getDate() + (7 - x.getDay())); return x; }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); }
function fmtDate(ts) {
  const d = new Date(ts), today = dayKey(), k = dayKey(d);
  if (k === today) return 'היום';
  if (daysBetween(k, today) === 1) return 'אתמול';
  return d.toLocaleDateString('he-IL', {weekday:'long', day:'numeric', month:'numeric'});
}
function levelIndex(xp) { let i = 0; for (let j = 0; j < LEVELS.length; j++) if (xp >= LEVELS[j].xp) i = j; return i; }
function themeById(id) { return THEMES.find(t => t.id === id) || THEMES[0]; }
function actById(id) { return ACTIVITIES.find(a => a.id === id) || ACTIVITIES[ACTIVITIES.length-1]; }
function badgeById(id) { return BADGES.find(b => b.id === id); }

/* דחיסת תמונה בצד לקוח ל-JPEG data URL (עד ~250KB) */
async function compressImage(file, maxDim) {
  maxDim = maxDim || 900;
  let bmp = null;
  try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = rej; img.src = url;
    });
  }
  const w = bmp.width, h = bmp.height, sc = Math.min(1, maxDim / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.72, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 250 * 1365 && q > 0.35) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); } // ‎~250KB base64
  return out;
}

/* ===================== חישובי שבוע ===================== */
function curWeek() {
  if (!state.challenge) return 0;
  const n = Math.floor(daysBetween(state.challenge.startDate, dayKey()) / 7);
  return Math.max(0, Math.min(n, state.challenge.weeksTotal - 1));
}
function weekInfo(n) {
  const ch = state.challenge, saved = state.weeks[n] || {};
  const order = ch.captainOrder && ch.captainOrder.length ? ch.captainOrder : Object.keys(state.members);
  return {
    n,
    captainUid: saved.captainUid || order[n % order.length],
    goalMin: saved.goalMin || ch.defaultGoalMin,
    theme: saved.theme || THEMES[n % THEMES.length].id,  // ברירת מחדל: ערכת נושא מתחלפת כל שבוע
    bonus: saved.bonus || '',
    title: saved.title || '',
    groupBonusDone: !!saved.groupBonusDone,
    groupSleepBonusDone: !!saved.groupSleepBonusDone,
    panel: saved.panel || null,
    brings: saved.brings || {},
  };
}
/* ברירות המחדל של נתוני שבוע למשתתף — מקור אמת יחיד */
const WS_DEFAULTS = () => ({min:0, daysArr:[], goalBonus:false, spreadBonus:false, bonusClaim:false, sleep:0, sleepLog:{}, sleepGoalBonus:false, hab:{}, habBonus:{}});
function memberWeek(m, n) { return (m.weekStats && m.weekStats[n]) || WS_DEFAULTS(); }
function groupWeekMin(n) { return Object.values(state.members).reduce((s, m) => s + memberWeek(m, n).min, 0); }
function groupWeekSleep(n) { return Math.round(Object.values(state.members).reduce((s, m) => s + (memberWeek(m, n).sleep || 0), 0) * 10) / 10; }
function groupXpTotal() { return Object.values(state.members).reduce((s, m) => s + (m.xp || 0), 0); }
function cheatPending() { return Math.floor(groupXpTotal() / CHEAT_XP_STEP) - (state.challenge.cheatUsed || 0); }
function daysLeftInWeek() {
  const end = Date.parse(state.challenge.startDate) + (curWeek()+1) * 7 * 864e5;
  return Math.max(0, Math.ceil((end - Date.now()) / 864e5));
}

/* ===================== מנוע המשחוק =====================
   פונקציה טהורה: מקבלת עותק של משתתף + דיווח, מחזירה משתתף
   מעודכן, XP שהתקבל ורשימת אירועים (תג/דרגה/בונוס). משמשת גם
   את מצב ההדגמה וגם את מצב הענן — מקור אמת אחד לחוקים. */
function applyCheckin(member, weekN, weekGoal, checkin) {
  const m = JSON.parse(JSON.stringify(member));
  m.badges = m.badges || []; m.weekStats = m.weekStats || {};
  const ws = m.weekStats[weekN] = Object.assign(WS_DEFAULTS(), m.weekStats[weekN]);
  const day = checkin.day, events = [];
  let xp = 10 + Math.floor(checkin.minutes / 5);

  if (m.lastActiveDay !== day) {                      // יום פעיל חדש → רצף
    const gap = m.lastActiveDay ? daysBetween(m.lastActiveDay, day) : null;
    const shieldReady = !m.shieldReadyAt || day >= m.shieldReadyAt;
    if (gap === 1) m.streakDays = (m.streakDays || 0) + 1;
    else if (gap === 2 && shieldReady && (m.streakDays || 0) >= 2) {
      // מגן רצף (loss aversion בסגנון Duolingo): פספוס של יום אחד בדיוק
      // נבלע והרצף נשמר; המגן נטען מחדש אחרי 14 יום
      m.streakDays = (m.streakDays || 0) + 1;
      m.shieldReadyAt = addDaysKey(day, 14);
      events.push({t:'shield'});
    }
    else {
      // קאמבק: חזרה אחרי 3+ ימים בלי אימון (פער של 4+ ימים מהיום הפעיל האחרון)
      if (gap != null && gap >= 4 && !m.badges.includes('comeback')) { m.badges.push('comeback'); events.push({t:'badge', id:'comeback'}); }
      m.streakDays = 1;
    }
    m.lastActiveDay = day;
    xp += 5 * Math.min(m.streakDays, 7);
    if (m.streakDays === 7 && !m.badges.includes('streak7')) { m.badges.push('streak7'); events.push({t:'badge', id:'streak7'}); }
  }
  if (!ws.daysArr.includes(day)) ws.daysArr.push(day);
  ws.min += checkin.minutes;

  if (ws.daysArr.length >= 3 && !ws.spreadBonus) { ws.spreadBonus = true; xp += 20; events.push({t:'bonus', txt:'3 ימים פעילים השבוע! +20'}); }
  if (ws.min >= weekGoal && !ws.goalBonus) {
    ws.goalBonus = true; xp += 50; events.push({t:'bonus', txt:'עמידה ביעד השבועי! +50'});
    if (!m.badges.includes('perfect')) { m.badges.push('perfect'); events.push({t:'badge', id:'perfect'}); }
  }
  const lvBefore = levelIndex(m.xp || 0);
  m.xp = (m.xp || 0) + xp;
  if (levelIndex(m.xp) > lvBefore) events.push({t:'level', lv: levelIndex(m.xp)});
  return {m, xp, events};
}

/* ניקוד שינה ללילה: מ-7 שע' יש XP, 8 = מושלם. מעל 8 לא נספר. */
function sleepXp(h) { return h >= 8 ? 8 : h >= 7.5 ? 6 : h >= SLEEP_NIGHT_MIN ? 5 : 0; }
/* דיווח שינה — פונקציה טהורה כמו applyCheckin. דיווח חוזר לאותו לילה מחליף
   את הקודם (הפרשי שעות ו-XP מחושבים, אי אפשר "לחלוב" נקודות). */
function applySleep(member, weekN, hoursRaw, day) {
  const m = JSON.parse(JSON.stringify(member));
  m.badges = m.badges || []; m.weekStats = m.weekStats || {};
  const ws = m.weekStats[weekN] = Object.assign(WS_DEFAULTS(), m.weekStats[weekN]);
  ws.sleepLog = ws.sleepLog || {};
  const counted = Math.min(hoursRaw, SLEEP_NIGHT_MAX);
  const prev = ws.sleepLog[day] || {h:0, xp:0};
  const nxp = sleepXp(counted);
  ws.sleep = Math.round((ws.sleep - prev.h + counted) * 10) / 10;
  ws.sleepLog[day] = {h: counted, xp: nxp};
  let dxp = nxp - prev.xp;
  const events = [];
  if (ws.sleep >= SLEEP_WEEK_GOAL && !ws.sleepGoalBonus) {
    ws.sleepGoalBonus = true; dxp += 30; events.push({t:'bonus', txt:'יעד השינה השבועי הושג! +30'});
    if (!m.badges.includes('sleep')) { m.badges.push('sleep'); events.push({t:'badge', id:'sleep'}); }
  }
  const lvBefore = levelIndex(m.xp || 0);
  m.xp = (m.xp || 0) + dxp;
  if (levelIndex(m.xp) > lvBefore) events.push({t:'level', lv: levelIndex(m.xp)});
  return {m, xp: dxp, events};
}

/* האתגר היומי (למשל: מתחת ל-100 גרם פחמימות) — סימון יום בוצע/בוטל.
   ‎+10 XP ליום, בונוס ‎+25 על שבוע מלא (7/7). ביטול מחזיר את הנקודות. */
function applyHabit(member, weekN, day, on, idx) {
  idx = idx || 0;
  const m = JSON.parse(JSON.stringify(member));
  m.badges = m.badges || []; m.weekStats = m.weekStats || {};
  const ws = m.weekStats[weekN] = Object.assign(WS_DEFAULTS(), m.weekStats[weekN]);
  ws.hab = ws.hab || {}; ws.habBonus = ws.habBonus || {};
  if (idx === 0 && !ws.hab[0] && ws.habitDays) ws.hab[0] = ws.habitDays.slice();   // מיגרציה מהמבנה הישן
  const arr = ws.hab[idx] = (ws.hab[idx] || []);
  const has = arr.includes(day);
  if (on === has) return {m, xp: 0, events: []};
  let dxp = 0; const events = [];
  if (on) {
    arr.push(day); dxp += 10;
    if (arr.length >= 7 && !ws.habBonus[idx]) { ws.habBonus[idx] = true; dxp += 25; events.push({t:'bonus', txt:'שבוע מושלם באתגר היומי! +25'}); }
  } else {
    ws.hab[idx] = arr.filter(d => d !== day); dxp -= 10;
  }
  const lvBefore = levelIndex(m.xp || 0);
  m.xp = (m.xp || 0) + dxp;
  if (levelIndex(m.xp) > lvBefore) events.push({t:'level', lv: levelIndex(m.xp)});
  return {m, xp: dxp, events};
}
/* אירועי מנוע → פריטי פיד מערכתיים + טוסטים (ניסוח ניטרלי-מגדרית) */
function eventFeedText(name, ev) {
  if (ev.t === 'level') return '🎉 דרגה חדשה ל' + name + ': ' + LEVELS[ev.lv].n + ' ' + LEVELS[ev.lv].e + '!';
  if (ev.t === 'badge') { const b = badgeById(ev.id); return b.e + ' תג חדש ל' + name + ': "' + b.n + '"!'; }
  if (ev.t === 'shield') return '🛡️ מגן הרצף הציל את הרצף של ' + name + '!';
  return null;
}
/* סיכום שבוע שעבר — נוסח להודעת מערכת בפיד (אפקט "התחלה חדשה") */
function weekSummaryText(prev) {
  const cnt = Object.keys(state.members).length;
  const wi = weekInfo(prev);
  const totMin = groupWeekMin(prev), gGoal = wi.goalMin * cnt;
  const totSleep = groupWeekSleep(prev), sGoal = SLEEP_WEEK_GOAL * cnt;
  let champ = null, cm = 0;
  Object.values(state.members).forEach(m => { const v = memberWeek(m, prev).min; if (v > cm) { cm = v; champ = m; } });
  const totHabit = Object.values(state.members).reduce((s, m) => s + habTotal(memberWeek(m, prev)), 0);
  return '📊 סיכום שבוע ' + (prev + 1) + ': ' + totMin + '/' + gGoal + ' דק\' אימון' + (totMin >= gGoal ? ' ✅' : '') +
    ' · ' + totSleep + '/' + sGoal + ' שע\' שינה' + (totSleep >= sGoal ? ' ✅' : '') +
    (totHabit > 0 ? ' · 🥦 ' + totHabit + ' ימי תזונה' : '') +
    (champ && cm > 0 ? ' · MVP: ' + champ.name + ' ' + champ.emoji + ' (' + cm + ' דק\')' : '') +
    ' · שבוע חדש, דף חלק — קדימה! 🌅';
}
async function maybePostWeekSummary() {
  if (!state.challenge || !Object.keys(state.members).length) return;
  const w = curWeek(); if (w < 1) return;
  const prev = w - 1;
  if ((state.weeks[prev] || {}).summaryPosted) return;
  try { await Store.postWeekSummary(prev, weekSummaryText(prev)); if (state.mode === 'demo') render(); } catch (e) {}
}

let Store = null;

/* ---------- מצב הדגמה: localStorage ---------- */
const DemoStore = {
  LS: 'fitordie_real_v1',
  data: null,
  async boot() {
    state.mode = 'demo';
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.LS)); } catch (e) {}
    if (!d || !d.challenge) { d = this.seed(); }
    this.data = d;
    this.save();
    state.challenge = d.challenge; state.members = d.members;
    state.weeks = d.weeks; state.feed = d.feed;
    state.me = d.me;
    state.view = d.me ? 'home' : 'pickuser';
    state.booting = false;
  },
  save() { try { localStorage.setItem(this.LS, JSON.stringify(this.data)); } catch (e) {} },
  pickUser(uid) {
    this.data.me = uid; state.me = uid;
    this.save(); state.view = 'home'; applyTheme(); render();
  },
  reset() { localStorage.removeItem(this.LS); location.reload(); },

  async checkin(c) {
    const w = curWeek(), wi = weekInfo(w);
    const groupBefore = groupWeekMin(w);
    this._gxpBefore = groupXpTotal();
    const res = applyCheckin(state.members[state.me], w, wi.goalMin, c);
    // ראשון בשטח: הדיווח הראשון בקבוצה השבוע (מיום ראשון) — תג + 15 XP
    if (groupBefore === 0) {
      res.m.xp += 15;
      if (!res.m.badges.includes('first')) { res.m.badges.push('first'); res.events.push({t:'badge', id:'first'}); }
      res.events.push({t:'firstweek'});
    }
    state.members[state.me] = res.m;
    this.data.members = state.members;
    state.feed.push({id: uidGen(), type:'checkin', uid: state.me, ts: Date.now(), week: w,
      activity: c.activity, minutes: c.minutes, text: c.note || '', photo: c.photo || null, reactions:{}});
    if (groupBefore === 0)
      state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'🎬 ראשון בשטח — ' + res.m.name + ' עם הדיווח הראשון של שבוע ' + (w+1) + '! +15', reactions:{}});
    const name = res.m.name;
    res.events.forEach(ev => {
      const txt = eventFeedText(name, ev);
      if (txt) state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text: txt, reactions:{}});
    });
    // בונוס קבוצתי — כשהקבוצה חוצה את היעד המשותף
    const groupGoal = wi.goalMin * Object.keys(state.members).length;
    if (!wi.groupBonusDone && groupBefore < groupGoal && groupWeekMin(w) >= groupGoal) {
      state.weeks[w] = Object.assign({}, state.weeks[w], {groupBonusDone: true});
      Object.values(state.members).forEach(m => m.xp += 30);
      state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'🏆 הקבוצה עמדה ביעד השבועי! +30 XP לכל אחד!', reactions:{}});
      res.events.push({t:'group'});
    }
    // חציית סף פאנל ה-CHEAT (כל CHEAT_XP_STEP נק' קבוצתיות)
    if (Math.floor(this._gxpBefore / CHEAT_XP_STEP) < Math.floor(groupXpTotal() / CHEAT_XP_STEP)) {
      state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'🍕 הקבוצה חצתה ' + Math.floor(groupXpTotal() / CHEAT_XP_STEP) * CHEAT_XP_STEP + ' XP — פאנל CHEAT נפתח!', reactions:{}});
      res.events.push({t:'cheat'});
    }
    this.save();
    return res;
  },
  async sendMsg(text) {
    state.feed.push({id: uidGen(), type:'msg', uid: state.me, ts: Date.now(), text, reactions:{}});
    this.save();
  },
  async react(fid, ri) {
    const it = state.feed.find(f => f.id === fid); if (!it) return;
    it.reactions = it.reactions || {};
    const arr = it.reactions['r'+ri] = it.reactions['r'+ri] || [];
    const i = arr.indexOf(state.me);
    if (i >= 0) arr.splice(i, 1); else arr.push(state.me);
    this.save();
  },
  async setWeekPlan(n, plan) {
    state.weeks[n] = Object.assign({}, state.weeks[n], plan);
    this.data.weeks = state.weeks;
    const me = state.members[state.me];
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(),
      text:'⚡ ' + me.name + ' — תוכנית השבוע: יעד ' + plan.goalMin + ' דק\' · נושא "' + themeById(plan.theme).n + '"' + (plan.bonus ? ' · משימת בונוס: ' + plan.bonus : ''), reactions:{}});
    this.save();
  },
  async claimBonus() {
    const w = curWeek(), m = state.members[state.me];
    const ws = m.weekStats[w] = Object.assign(WS_DEFAULTS(), m.weekStats[w]);
    if (ws.bonusClaim) return false;
    ws.bonusClaim = true; m.xp += 20;
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'🎯 משימת הבונוס הושלמה — ' + m.name + ' +20 XP', reactions:{}});
    this.save();
    return true;
  },
  async saveProfile(patch) { Object.assign(state.members[state.me], patch); this.save(); },
  async saveShared(patch) { Object.assign(state.members[state.me], patch); this.save(); },
  async addMeasure(entry) {
    const m = state.members[state.me];
    m.measures = m.measures || [];
    m.measures.push(entry);
    this.save();
  },
  async sendPhoto(data) {
    state.feed.push({id: uidGen(), type:'msg', uid: state.me, ts: Date.now(), text:'', photo: data, reactions:{}});
    this.save();
  },
  async sleep(h) {
    const w = curWeek(), before = groupWeekSleep(w);
    const res = applySleep(state.members[state.me], w, h, dayKey());
    state.members[state.me] = res.m;
    this.data.members = state.members;
    res.events.forEach(ev => {
      const txt = eventFeedText(res.m.name, ev);
      if (txt) state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text: txt, reactions:{}});
    });
    const goal = SLEEP_WEEK_GOAL * Object.keys(state.members).length;
    if (!weekInfo(w).groupSleepBonusDone && before < goal && groupWeekSleep(w) >= goal) {
      state.weeks[w] = Object.assign({}, state.weeks[w], {groupSleepBonusDone: true});
      Object.values(state.members).forEach(m => m.xp += 20);
      state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'😴 הקבוצה עמדה ביעד השינה השבועי! +20 XP לכל אחד!', reactions:{}});
      res.events.push({t:'gsleep'});
    }
    this.save();
    return res;
  },
  async setPanel(n, panel) {
    state.weeks[n] = Object.assign({}, state.weeks[n], {panel});
    this.data.weeks = state.weeks;
    const host = state.members[panel.host];
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(),
      text:'🥗 פאנל שבועי: אצל ' + (host ? host.name : '?') + (panel.when ? ' · ' + panel.when : '') + (panel.location ? ' · 📍 ' + panel.location : '') + (panel.motif ? ' · "' + panel.motif + '"' : ''), reactions:{}});
    this.save();
  },
  async saveChallenge(patch) {
    Object.assign(state.challenge, patch);
    this.data.challenge = state.challenge;
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'⚙️ הגדרות האתגר עודכנו ע"י ' + state.members[state.me].name, reactions:{}});
    this.save();
  },
  async habit(on, idx) {
    const w = curWeek();
    const res = applyHabit(state.members[state.me], w, dayKey(), on, idx || 0);
    state.members[state.me] = res.m;
    this.data.members = state.members;
    res.events.forEach(ev => {
      const txt = eventFeedText(res.m.name, ev);
      if (txt) state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text: txt, reactions:{}});
    });
    this.save();
    return res;
  },
  async claimCheat() {
    state.challenge.cheatUsed = (state.challenge.cheatUsed || 0) + 1;
    this.data.challenge = state.challenge;
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'🍕 פאנל ה-CHEAT נחגג! הספירה לפאנל הבא התחילה 💪', reactions:{}});
    this.save();
  },
  async resetGroup() {
    Object.values(state.members).forEach(m => { m.xp = 0; m.badges = []; m.streakDays = 0; m.lastActiveDay = null; m.weekStats = {}; });
    state.weeks = {}; this.data.weeks = state.weeks;
    state.feed = []; this.data.feed = state.feed;
    state.challenge.startDate = dayKey(sundayOf(new Date()));
    state.challenge.cheatUsed = 0;
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text:'🔄 האתגר אופס — יוצאים לדרך חדשה! 🚀', reactions:{}});
    this.save();
  },
  async setBring(n, text) {
    const wk = state.weeks[n] = Object.assign({}, state.weeks[n]);
    wk.brings = Object.assign({}, wk.brings);
    wk.brings[state.me] = text;
    this.data.weeks = state.weeks;
    this.save();
  },
  async setPlanDays(n, plan) {
    const m = state.members[state.me];
    m.weekStats = m.weekStats || {};
    m.weekStats[n] = Object.assign(WS_DEFAULTS(), m.weekStats[n], {planDays: plan});
    this.save();
  },
  async postWeekSummary(n, text) {
    if ((state.weeks[n] || {}).summaryPosted) return;
    state.weeks[n] = Object.assign({}, state.weeks[n], {summaryPosted: true});
    this.data.weeks = state.weeks;
    state.feed.push({id: uidGen(), type:'system', ts: Date.now(), text, reactions:{}});
    this.save();
  },

  /* הקבוצה האמיתית — דף חלק לגמרי: אפס נקודות, אפס דיווחים, פיד ריק.
     שבוע 1 מתחיל ביום ראשון הקרוב. מרקו הוא ברירת המחדל וקפטן שבוע 1. */
  seed() {
    const ch = {id:'main', name:'Fit or DIE! 💀🔥', code:'FIT1', startDate: dayKey(nextSunday()),
      weeksTotal: 12, defaultGoalMin: 150, organizerUid:'u1',
      captainOrder:['u1','u2','u3','u4','u5','u6'], dailyHabits: DEFAULT_DAILY_HABITS.slice(), cheatUsed: 0};
    const mk = (uid, name, emoji, color, avatar, pet, pic) => ({uid, name, emoji, color, avatar, pet,
      avatarImg: 'avatars/' + avatar + '-' + pic + '.jpg', joinedAt: Date.parse(ch.startDate),
      xp: 0, badges: [], streakDays: 0, lastActiveDay: null, weekStats: {}, measures: []});
    const members = {
      u1: mk('u1','מרקו','🦸‍♂️','#38b6ff','fighter','wolf', 2),
      u2: mk('u2','בן',  '🥷','#3ddc84','rogue','owl', 4),
      u3: mk('u3','יגאל','🔨','#f97316','dwarf','horse', 3),
      u4: mk('u4','נטע', '🏹','#b388ff','ranger','butterfly', 5),
      u5: mk('u5','בקה', '✨','#ff7ab6','cleric','unicorn', 2),
      u6: mk('u6','ויקס','🔮','#2dd4bf','wizard','griffin', 6),
    };
    // שבוע 1 — מרקו קפטן; אין עדיין יעדים/פאנל/היסטוריה
    const weeks = {0: {captainUid: 'u1'}};
    return {challenge: ch, members, weeks, feed: [], me: 'u1'};
  },
};

/* ---------- מצב ענן: Firebase (compat SDK, נטען דינמית) ---------- */
const FireStore = {
  db: null, auth: null, cid: null, unsubs: [],
  FV: null,
  loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script load failed: '+src)); document.head.appendChild(s); }); },
  async boot() {
    state.mode = 'fire';
    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    try {
      await this.loadScript(base + 'firebase-app-compat.js');
      await this.loadScript(base + 'firebase-auth-compat.js');
      await this.loadScript(base + 'firebase-firestore-compat.js');
    } catch (e) {
      state.booting = false; state.view = 'neterror'; render(); return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    this.FV = firebase.firestore.FieldValue;
    try { await this.db.enablePersistence({synchronizeTabs:true}); } catch (e) {}
    this.auth.onAuthStateChanged(async u => {
      state.authUser = u;
      if (!u) { this.detach(); state.me = null; state.booting = false; state.view = 'auth'; render(); return; }
      state.me = u.uid;
      await this.resolveMembership();
    });
  },
  async resolveMembership() {
    try {
      const udoc = await this.db.doc('users/' + state.me).get();
      const cid = udoc.exists ? udoc.data().cid : null;
      if (cid) { this.attach(cid); }
      else { state.booting = false; state.view = 'join'; render(); }
    } catch (e) { state.booting = false; state.view = 'join'; showToast('שגיאת טעינה: ' + e.message, 'bad'); render(); }
  },
  chRef() { return this.db.collection('challenges').doc(this.cid); },
  attach(cid) {
    this.detach(); this.cid = cid;
    const done = {ch:false, mem:false};
    const ready = () => { if (done.ch && done.mem && state.booting) {
      state.booting = false;
      // אם אין עדיין כרטיס משתתף: המשך תהליך הצטרפות אם יש כזה בתהליך,
      // אחרת חזרה למסך הקוד (מצב חלקי, למשל התנתקות באמצע רישום)
      state.view = state.members[state.me] ? 'home' : (state.pendingJoin ? 'onboard' : 'join');
      applyTheme();
      setTimeout(maybePostWeekSummary, 1500);
    } render(); };
    this.unsubs.push(this.chRef().onSnapshot(s => {
      if (!s.exists) return;
      state.challenge = Object.assign({id: cid}, s.data());
      done.ch = true; ready();
    }, e => showToast('שגיאה: ' + e.message, 'bad')));
    this.unsubs.push(this.chRef().collection('members').onSnapshot(s => {
      const m = {}; s.forEach(d => m[d.id] = Object.assign({uid: d.id}, d.data()));
      state.members = m; done.mem = true; ready();
    }));
    this.unsubs.push(this.chRef().collection('weeks').onSnapshot(s => {
      const w = {}; s.forEach(d => w[d.id] = d.data());
      state.weeks = w; applyTheme(); render();
    }));
    this.unsubs.push(this.chRef().collection('feed').orderBy('ts', 'desc').limit(150).onSnapshot(s => {
      const f = []; s.forEach(d => f.push(Object.assign({id: d.id}, d.data())));
      f.reverse(); state.feed = f; render();
    }));
  },
  detach() { this.unsubs.forEach(u => { try { u(); } catch(e) {} }); this.unsubs = []; this.cid = null; },

  async signUp(email, pass) { await this.auth.createUserWithEmailAndPassword(email, pass); },
  async signIn(email, pass) { await this.auth.signInWithEmailAndPassword(email, pass); },
  /* כניסה עם חשבון Google — חלון קופץ, ובנפילה (חסימת פופאפים / PWA באייפון)
     מעבר אוטומטי לזרימת הפניה מלאה. */
  async signInGoogle() {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt: 'select_account'});
    try { await this.auth.signInWithPopup(p); }
    catch (e) {
      const fb = ['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request',
        'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported', 'auth/internal-error'];
      if (fb.includes(e.code)) await this.auth.signInWithRedirect(p);
      else throw e;
    }
  },
  async signOut() { await this.auth.signOut(); location.reload(); },

  async createChallenge(f) {
    const ref = this.db.collection('challenges').doc();
    await ref.set({name: f.name, code: f.code.toUpperCase(), startDate: dayKey(sundayOf(new Date(Date.parse(f.start)))),
      weeksTotal: f.weeks, defaultGoalMin: f.goal, organizerUid: state.me, captainOrder: [],
      dailyHabits: DEFAULT_DAILY_HABITS.slice(), dailyHabit: DEFAULT_DAILY_HABIT, createdAt: Date.now()});
    state.pendingJoin = {cid: ref.id, code: f.code.toUpperCase()};
    state.view = 'onboard'; render();
  },
  async joinByCode(code) {
    code = code.trim().toUpperCase();
    const q = await this.db.collection('challenges').where('code', '==', code).limit(1).get();
    if (q.empty) { showToast('לא נמצא אתגר עם הקוד הזה', 'bad'); return; }
    state.pendingJoin = {cid: q.docs[0].id, code};
    state.view = 'onboard'; render();
  },
  async completeOnboard(profile, extraData) {
    const {cid, code} = state.pendingJoin;
    const mRef = this.db.collection('challenges').doc(cid).collection('members').doc(state.me);
    // המשקל והתמונות משותפים לחברי האתגר — יושבים ישירות על כרטיס המשתתף
    await mRef.set(Object.assign({name: profile.name, emoji: profile.emoji, color: profile.color, avatar: profile.avatar || 'fighter',
      avatarImg: profile.avatarImg || null, pet: profile.pet || 'butterfly', joinCode: code,
      joinedAt: Date.now(), xp: 0, badges: [], streakDays: 0, lastActiveDay: null, weekStats: {}, measures: []}, extraData || {}));
    await this.db.collection('challenges').doc(cid).update({captainOrder: this.FV.arrayUnion(state.me)});
    await this.db.doc('users/' + state.me).set({cid});
    state.pendingJoin = null;
    this.attach(cid);
    state.view = 'home'; state.booting = false; render();
  },

  async checkin(c) {
    const w = curWeek(), wi = weekInfo(w);
    const groupBefore = groupWeekMin(w);
    const res = applyCheckin(state.members[state.me], w, wi.goalMin, c);
    // ראשון בשטח: הדיווח הראשון בקבוצה השבוע — תג + 15 XP
    if (groupBefore === 0) {
      res.m.xp += 15;
      if (!res.m.badges.includes('first')) { res.m.badges.push('first'); res.events.push({t:'badge', id:'first'}); }
      res.events.push({t:'firstweek'});
    }
    const b = this.db.batch();
    const mRef = this.chRef().collection('members').doc(state.me);
    b.update(mRef, {xp: res.m.xp, badges: res.m.badges, streakDays: res.m.streakDays,
      lastActiveDay: res.m.lastActiveDay, ['weekStats.' + w]: res.m.weekStats[w]});
    b.set(this.chRef().collection('feed').doc(), {type:'checkin', uid: state.me, ts: Date.now(), week: w,
      activity: c.activity, minutes: c.minutes, text: c.note || '', photo: c.photo || null, reactions:{}});
    res.events.forEach(ev => {
      const txt = eventFeedText(res.m.name, ev);
      if (txt) b.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+1, text: txt, reactions:{}});
    });
    if (groupBefore === 0)
      b.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+1,
        text:'🎬 ראשון בשטח — ' + res.m.name + ' עם הדיווח הראשון של שבוע ' + (w+1) + '! +15', reactions:{}});
    // חציית סף פאנל ה-CHEAT (חישוב מקומי: הנקודות שנוספו לי בדיווח הזה)
    const gxpBefore = groupXpTotal();
    const gxpAfter = gxpBefore + (res.m.xp - (state.members[state.me].xp || 0));
    if (Math.floor(gxpBefore / CHEAT_XP_STEP) < Math.floor(gxpAfter / CHEAT_XP_STEP)) {
      b.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+2,
        text:'🍕 הקבוצה חצתה ' + Math.floor(gxpAfter / CHEAT_XP_STEP) * CHEAT_XP_STEP + ' XP — פאנל CHEAT נפתח!', reactions:{}});
      res.events.push({t:'cheat'});
    }
    await b.commit();
    // בונוס קבוצתי בטרנזקציה — פעם אחת בלבד לשבוע
    const groupGoal = wi.goalMin * Object.keys(state.members).length;
    if (!wi.groupBonusDone && groupBefore < groupGoal && groupBefore + c.minutes >= groupGoal) {
      const wRef = this.chRef().collection('weeks').doc(String(w));
      try {
        await this.db.runTransaction(async tx => {
          const wd = await tx.get(wRef);
          if (wd.exists && wd.data().groupBonusDone) return;
          tx.set(wRef, {groupBonusDone: true}, {merge: true});
        });
        const b2 = this.db.batch();
        Object.keys(state.members).forEach(uid =>
          b2.update(this.chRef().collection('members').doc(uid), {xp: this.FV.increment(30)}));
        b2.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+2,
          text:'🏆 הקבוצה עמדה ביעד השבועי! +30 XP לכל אחד!', reactions:{}});
        await b2.commit();
        res.events.push({t:'group'});
      } catch (e) {}
    }
    return res;
  },
  async sendMsg(text) {
    await this.chRef().collection('feed').add({type:'msg', uid: state.me, ts: Date.now(), text, reactions:{}});
  },
  async react(fid, ri) {
    const it = state.feed.find(f => f.id === fid); if (!it) return;
    const arr = ((it.reactions || {})['r'+ri] || []).slice();
    const i = arr.indexOf(state.me);
    if (i >= 0) arr.splice(i, 1); else arr.push(state.me);
    await this.chRef().collection('feed').doc(fid).update({['reactions.r'+ri]: arr});
  },
  async setWeekPlan(n, plan) {
    await this.chRef().collection('weeks').doc(String(n)).set(plan, {merge: true});
    const me = state.members[state.me];
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(),
      text:'⚡ ' + me.name + ' — תוכנית השבוע: יעד ' + plan.goalMin + ' דק\' · נושא "' + themeById(plan.theme).n + '"' + (plan.bonus ? ' · משימת בונוס: ' + plan.bonus : ''), reactions:{}});
  },
  async claimBonus() {
    const w = curWeek(), m = state.members[state.me];
    const ws = Object.assign(WS_DEFAULTS(), memberWeek(m, w));
    if (ws.bonusClaim) return false;
    ws.bonusClaim = true;
    await this.chRef().collection('members').doc(state.me).update({['weekStats.' + w]: ws, xp: this.FV.increment(20)});
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(), text:'🎯 משימת הבונוס הושלמה — ' + m.name + ' +20 XP', reactions:{}});
    return true;
  },
  async saveProfile(patch) { await this.chRef().collection('members').doc(state.me).update(patch); },
  async saveShared(patch) { await this.chRef().collection('members').doc(state.me).update(patch); },
  async addMeasure(entry) {
    await this.chRef().collection('members').doc(state.me).update({measures: this.FV.arrayUnion(entry)});
  },
  async sendPhoto(data) {
    await this.chRef().collection('feed').add({type:'msg', uid: state.me, ts: Date.now(), text:'', photo: data, reactions:{}});
  },
  async sleep(h) {
    const w = curWeek(), before = groupWeekSleep(w);
    const res = applySleep(state.members[state.me], w, h, dayKey());
    const b = this.db.batch();
    b.update(this.chRef().collection('members').doc(state.me),
      {xp: res.m.xp, badges: res.m.badges, ['weekStats.' + w]: res.m.weekStats[w]});
    res.events.forEach(ev => {
      const txt = eventFeedText(res.m.name, ev);
      if (txt) b.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+1, text: txt, reactions:{}});
    });
    await b.commit();
    const goal = SLEEP_WEEK_GOAL * Object.keys(state.members).length;
    if (!weekInfo(w).groupSleepBonusDone && before < goal && before - (memberWeek(state.members[state.me], w).sleep || 0) + (res.m.weekStats[w].sleep || 0) >= goal - 0.001) {
      const wRef = this.chRef().collection('weeks').doc(String(w));
      try {
        await this.db.runTransaction(async tx => {
          const wd = await tx.get(wRef);
          if (wd.exists && wd.data().groupSleepBonusDone) return;
          tx.set(wRef, {groupSleepBonusDone: true}, {merge: true});
        });
        const b2 = this.db.batch();
        Object.keys(state.members).forEach(uid =>
          b2.update(this.chRef().collection('members').doc(uid), {xp: this.FV.increment(20)}));
        b2.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+2,
          text:'😴 הקבוצה עמדה ביעד השינה השבועי! +20 XP לכל אחד!', reactions:{}});
        await b2.commit();
        res.events.push({t:'gsleep'});
      } catch (e) {}
    }
    return res;
  },
  async setPanel(n, panel) {
    await this.chRef().collection('weeks').doc(String(n)).set({panel}, {merge: true});
    const host = state.members[panel.host];
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(),
      text:'🥗 פאנל שבועי: אצל ' + (host ? host.name : '?') + (panel.when ? ' · ' + panel.when : '') + (panel.location ? ' · 📍 ' + panel.location : '') + (panel.motif ? ' · "' + panel.motif + '"' : ''), reactions:{}});
  },
  async saveChallenge(patch) {
    await this.chRef().update(patch);
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(), text:'⚙️ הגדרות האתגר עודכנו ע"י ' + state.members[state.me].name, reactions:{}});
  },
  async habit(on, idx) {
    const w = curWeek();
    const res = applyHabit(state.members[state.me], w, dayKey(), on, idx || 0);
    const b = this.db.batch();
    b.update(this.chRef().collection('members').doc(state.me),
      {xp: res.m.xp, ['weekStats.' + w]: res.m.weekStats[w]});
    res.events.forEach(ev => {
      const txt = eventFeedText(res.m.name, ev);
      if (txt) b.set(this.chRef().collection('feed').doc(), {type:'system', ts: Date.now()+1, text: txt, reactions:{}});
    });
    await b.commit();
    return res;
  },
  async claimCheat() {
    await this.chRef().update({cheatUsed: this.FV.increment(1)});
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(), text:'🍕 פאנל ה-CHEAT נחגג! הספירה לפאנל הבא התחילה 💪', reactions:{}});
  },
  async resetGroup() {
    const b = this.db.batch();
    Object.keys(state.members).forEach(uid => b.update(this.chRef().collection('members').doc(uid),
      {xp: 0, badges: [], streakDays: 0, lastActiveDay: null, weekStats: {}}));
    b.update(this.chRef(), {startDate: dayKey(sundayOf(new Date())), cheatUsed: 0});
    await b.commit();
    const wk = await this.chRef().collection('weeks').get();
    if (!wk.empty) { const b2 = this.db.batch(); wk.forEach(d => b2.delete(d.ref)); await b2.commit(); }
    let fd = await this.chRef().collection('feed').limit(400).get();
    while (!fd.empty) {
      const bd = this.db.batch(); fd.forEach(d => bd.delete(d.ref)); await bd.commit();
      fd = await this.chRef().collection('feed').limit(400).get();
    }
    await this.chRef().collection('feed').add({type:'system', ts: Date.now(), text:'🔄 האתגר אופס — יוצאים לדרך חדשה! 🚀', reactions:{}});
  },
  async setBring(n, text) {
    await this.chRef().collection('weeks').doc(String(n)).set({brings: {[state.me]: text}}, {merge: true});
  },
  async setPlanDays(n, plan) {
    await this.chRef().collection('members').doc(state.me).update({['weekStats.' + n + '.planDays']: plan});
  },
  async postWeekSummary(n, text) {
    const wRef = this.chRef().collection('weeks').doc(String(n));
    let fresh = false;
    await this.db.runTransaction(async tx => {
      const wd = await tx.get(wRef);
      if (wd.exists && wd.data().summaryPosted) return;
      tx.set(wRef, {summaryPosted: true}, {merge: true});
      fresh = true;
    });
    if (fresh) await this.chRef().collection('feed').add({type:'system', ts: Date.now(), text, reactions:{}});
  },
};

/* ===================== ערכת נושא ===================== */
/* ערכת הנושא בפועל: ברירת מחדל = של השבוע (בחירת הקפטן), אבל כל אחד
   יכול לבחור לעצמו מראה קבוע במכשיר שלו (מההגדרות). */
function myTheme() {
  let pick = null;
  try { pick = localStorage.getItem('fitordie_theme'); } catch (e) {}
  if (pick && THEMES.some(t => t.id === pick)) return pick;
  return state.challenge ? weekInfo(curWeek()).theme : THEMES[0].id;
}
function setMyTheme(id) {
  try { if (id) localStorage.setItem('fitordie_theme', id); else localStorage.removeItem('fitordie_theme'); } catch (e) {}
  applyTheme(); render();
  showToast(id ? '🎨 המראה עודכן' : '🎨 חוזרים למראה של השבוע', 'gold');
}
function applyTheme() {
  if (!state.challenge) return;
  const t = themeById(myTheme());
  const r = document.documentElement.style;
  r.setProperty('--bg1', t.bg1); r.setProperty('--bg2', t.bg2);
  r.setProperty('--ac', t.ac); r.setProperty('--ac2', t.ac2);
  const me = state.members[state.me];
  if (me) r.setProperty('--me', me.color);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = t.bg1;
}

/* ===================== רכיבי תצוגה ===================== */
function avatarHTML(m, size) {
  const lv = levelIndex(m.xp || 0);
  const glow = 4 + lv * 3;
  return '<span class="ava s' + (size||2) + '" style="--c:' + m.color + ';box-shadow:0 0 ' + glow + 'px ' + m.color + '">' +
    m.emoji + '<span class="lvl">' + LEVELS[lv].e + '</span></span>';
}
function heroVisual(m, size) {
  const src = m.avatarImg || ('avatars/' + (classById(m.avatar) ? m.avatar : 'fighter') + '-1.jpg');
  m = Object.assign({}, m, {avatarImg: src});
  const lv = levelIndex(m.xp || 0);
  const rar = lv >= 6 ? '#ff7ab6' : lv >= 4 ? '#ffd23f' : lv >= 2 ? '#38b6ff' : '#aab3c8';
  const glow = lv >= 4 ? ';box-shadow:0 0 ' + (lv >= 6 ? 22 : 12) + 'px ' + m.color : '';
  return '<span class="heroimg" style="width:' + size + 'px;height:' + Math.round(size * 1.15) + 'px;border-color:' + rar + glow + '">' +
    '<img src="' + m.avatarImg + '" alt="">' + (lv >= 7 ? '<span class="crown">👑</span>' : '') + '</span>';
}
/* הדמות והחיה שלה יחד — החיה בגודל ~45% צמודה לדמות */
function heroDuo(m, size, petRatio) {
  const pet = petById(m.pet);
  if (!pet) return heroVisual(m, size);
  const ps = Math.max(44, Math.round(size * (petRatio || 0.42))), lv = levelIndex(m.xp || 0);
  return '<span class="duo">' + heroVisual(m, size) +
    '<span class="petbadge" style="width:' + ps + 'px;height:' + ps + 'px">' +
    '<img src="avatars/' + pet.id + '-' + (1 + (lv % 3)) + '.jpg" alt="" onerror="imgFallback(this)">' +
    '<span class="plv">' + pet.e + ' ' + petLevel(m) + '</span></span></span>';
}
function ringHTML(pct, size, stroke, color, centerHTML) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(pct, 1));
  return '<div class="ringwrap" style="width:' + size + 'px;height:' + size + 'px">' +
    '<svg width="' + size + '" height="' + size + '"><circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke="rgba(255,255,255,.1)" stroke-width="' + stroke + '" fill="none"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke="' + color + '" stroke-width="' + stroke + '" fill="none" stroke-linecap="round" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')" style="transition:stroke-dashoffset .8s"/></svg>' +
    '<div class="ringcenter">' + centerHTML + '</div></div>';
}
function topbarHTML() {
  const sub = ['sheet','profile','checkin','captain','settings','panel'].includes(state.view);
  return '<div class="topbar"><div class="logo">FIT or DIE! 💀<span class="ver">v' + APP_VERSION + '</span></div>' +

    '<button class="gear" onclick="nav(\'settings\')">⚙️</button></span></div>';
}
function feedUnread() {
  return state.feed.some(f => f.ts > (state.seenTs || 0) && f.uid !== state.me);
}
function navHTML() {
  const items = [['home','🏠','בית'], ['feed','💬','פיד'], null, ['panel','🥗','פאנל'], ['group','👥','קבוצה'], ['sheet','📜','דמות']];
  return '<nav class="bnav">' + items.map(it => {
    if (!it) return '<button class="fab" onclick="nav(\'checkin\')">＋</button>';
    const on = state.view === it[0] || (it[0] === 'sheet' && state.view === 'profile');
    const dot = it[0] === 'feed' && state.view !== 'feed' && feedUnread() ? '<span class="navdot"></span>' : '';
    return '<button class="' + (on ? 'on' : '') + '" onclick="nav(\'' + it[0] + '\')">' + dot + it[1] + '<span>' + it[2] + '</span></button>';
  }).join('') + '</nav>';
}

function homeHTML() {
  const cw = curWeek(), ch = state.challenge;
  // אפשר לדפדף לשבועות קודמים של הקבוצה ולראות את הנתונים שלהם
  const w = (state.homeWeek == null || state.homeWeek > cw) ? cw : Math.max(0, state.homeWeek);
  const live = w === cw;
  const wi = weekInfo(w);
  const me = state.members[state.me];
  const ws = memberWeek(me, w);
  const cap = state.members[wi.captainUid];
  const groupGoal = wi.goalMin * Object.keys(state.members).length;
  const gMin = groupWeekMin(w);
  const dl = daysLeftInWeek();
  const notStarted = dayKey() < ch.startDate;      // האתגר עוד לא נפתח
  const today = new Date().getDay();
  const weekStartTs = Date.parse(ch.startDate) + w * 7 * 864e5;
  const weekDates = new Date(weekStartTs).toLocaleDateString('he-IL', {day:'numeric', month:'numeric'}) + '–' +
    new Date(weekStartTs + 6 * 864e5).toLocaleDateString('he-IL', {day:'numeric', month:'numeric'});
  let h = topbarHTML();

  // כרטיס שבוע + ניווט בין שבועות (מופיע רק כשכבר יש שבוע קודם לראות)
  h += '<div class="card weekcard">' + (cw > 0
    ? '<div class="row spread">' +
      '<button class="chip" ' + (w > 0 ? 'onclick="homeWeek(' + (w-1) + ')"' : 'style="opacity:.25"') + '>▶ הקודם</button>' +
      '<b>שבוע ' + (w+1) + '/' + ch.weeksTotal + '</b>' +
      '<button class="chip" ' + (w < cw ? 'onclick="homeWeek(' + (w+1) + ')"' : 'style="opacity:.25"') + '>הבא ◀</button></div>'
    : '<div class="center"><b>שבוע ' + (w+1) + '/' + ch.weeksTotal + '</b></div>') +
    '<div class="row spread" style="margin-top:6px"><span class="tiny">' + esc(ch.name) + ' · ' + weekDates + '</span>' +
    '<span class="chip">🎨 ' + themeById(wi.theme).n + '</span></div>' +
    (wi.title ? '<div style="margin-top:6px;font-weight:800;color:var(--ac)">🎯 ' + esc(wi.title) + '</div>' : '') +
    '<div class="row spread" style="margin-top:7px"><span class="row" style="gap:6px">' + (cap ? avatarHTML(cap,1) + '<span class="muted">קפטן/ית: <b style="color:var(--tx)">' + esc(cap.name) + '</b></span>' : '') + '</span>' +

  // ===== פקדי הקפטן — ישירות במסך הבית =====
  if (live && wi.captainUid === state.me) {
    const d = state.weekDraft || (state.weekDraft = {goalMin: wi.goalMin, theme: wi.theme, bonus: wi.bonus,

    const hst = state.members[wi.panel.host];
    const bringsCnt = Object.keys(wi.brings).filter(k => wi.brings[k]).length;
    h += '<div class="row" style="gap:10px;margin-top:8px">' + avatarHTML(hst, 1) + '<b>אצל ' + esc(hst.name) + '</b>' +
      (wi.panel.when ? '<span class="chip">🕒 ' + esc(wi.panel.when) + '</span>' : '') + '</div>' +
      '<div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap">' +
      (wi.panel.location ? '<span class="chip">📍 ' + esc(wi.panel.location) + '</span>' : '') +
      (wi.panel.motif ? '<span class="chip">🎪 ' + esc(wi.panel.motif) + '</span>' : '') +
      '<span class="chip">🧺 נרשמו ' + bringsCnt + '/' + Object.keys(state.members).length + '</span></div>';
  } else {
    h += '<div class="muted" style="margin-top:6px">עוד לא נקבע פאנל השבוע — קבעו בלשונית הפאנל 🤗</div>';
  }
  if (cheatPend) h += '<div class="tiny" style="margin-top:8px;color:var(--ac)">הקבוצה צברה מספיק נקודות — הפאנל הקרוב הוא פאנל CHEAT חופשי מהחוקים! 🍕🍔</div>';
  h += '</div>';

  // מד פאנל ה-CHEAT — התקדמות לפי נקודות הניסיון של כל הקבוצה
  const gxp = groupXpTotal(), intoCheat = gxp % CHEAT_XP_STEP;
  if (live) h += '<div class="card"><div class="row spread"><b>🍕 מד פאנל ה-CHEAT</b><span class="tiny">' + gxp + ' XP קבוצתי</span></div>' +
    '<div class="mbar" style="margin-top:8px;height:12px"><i style="width:' + Math.round(intoCheat / CHEAT_XP_STEP * 100) + '%;background:linear-gradient(90deg,var(--ac),var(--ac2))"></i></div>' +
    '<div class="tiny" style="margin-top:5px">' + (cheatPend
      ? 'פאנל CHEAT ממתין לכם! אחרי שחגגתם — סמנו בלשונית הפאנל 🍕'
      : 'עוד ' + (CHEAT_XP_STEP - intoCheat) + ' נק\' קבוצתיות לפאנל CHEAT הבא (כל ' + CHEAT_XP_STEP + ')') + '</div></div>';

  // טבעת אישית + מד קבוצתי
  const pct = ws.min / wi.goalMin;
  h += '<div class="card"><div class="row" style="justify-content:space-around">' +
    ringHTML(pct, 150, 13, 'var(--ac)', '<b>' + ws.min + '</b><div class="tiny">מתוך ' + wi.goalMin + ' דק\'</div>' + (pct >= 1 ? '<div style="font-size:1.2em">🏆</div>' : '')) +
    '<div style="flex:1;max-width:180px">' +
      '<div class="muted">' + (live ? 'היעד שלי השבוע' : 'היעד שלי באותו שבוע') + '</div><div style="font-weight:900;font-size:1.3em">' + Math.min(100, Math.round(pct*100)) + '%</div>' +
      (live ? '<div class="muted" style="margin-top:8px">רצף ימים</div><div style="font-weight:900;font-size:1.3em">🔥 ' + (me.streakDays || 0) + '</div>' +
        '<div class="tiny" style="margin-top:3px">🛡️ ' + ((!me.shieldReadyAt || dayKey() >= me.shieldReadyAt) ? 'מגן רצף מוכן' : 'מגן ייטען בעוד ' + daysBetween(dayKey(), me.shieldReadyAt) + ' ימים') + '</div>' : '') +
    '</div></div>' +
    '<div class="daydots">' + DAY_LETTERS.map((L, i) => {
      const dk = dayKey(new Date(weekStartTs + i * 864e5));
      const on = ws.daysArr && ws.daysArr.includes(dk);
      const planned = (ws.planDays || []).includes(dk);
      const cls = on ? 'on' : planned ? (dk < dayKey() ? 'miss' : 'plan') : '';
      return '<div class="daydot ' + cls + ' ' + (live && i===today?'today':'') + '"' + (live ? ' onclick="togglePlanDay(\'' + dk + '\')"' : '') + '><i></i>' + L + '</div>';
    }).join('') + '</div>' +
    (live ? '<div class="tiny" style="margin-top:7px">💡 הקישו על יום עתידי כדי לתכנן בו אימון — תכנון מראש מוכח מחקרית כמכפיל ביצוע</div>' : '') + '</div>';

  // מד קבוצתי — כל משתתף בצבע שלו
  h += '<div class="card"><div class="row spread"><b>🤝 היעד הקבוצתי</b><span class="muted">' + gMin + ' / ' + groupGoal + ' דק\'</span></div>' +
    '<div class="gbar">' + Object.values(state.members).map(m =>
      '<i style="width:' + Math.min(100, (memberWeek(m,w).min / groupGoal) * 100) + '%;background:' + m.color + '" title="' + esc(m.name) + '"></i>').join('') + '</div>' +
    '<div class="row" style="margin-top:7px;gap:12px;flex-wrap:wrap">' + Object.values(state.members).map(m =>
      '<span class="tiny"><span style="color:' + m.color + '">●</span> ' + esc(m.name) + ' ' + memberWeek(m,w).min + '</span>').join('') + '</div>' +
    (wi.groupBonusDone ? '<div class="chip" style="margin-top:8px;color:var(--ok)">🏆 היעד הקבוצתי הושג! +30 לכולם</div>' : '') + '</div>';

  // אתגר יומי: שינה — סטטוס הלילה + מדדים שבועיים (אישי וקבוצתי)
  const mySleep = ws.sleep || 0, gSleep = groupWeekSleep(w);
  const sleepGroupGoal = SLEEP_WEEK_GOAL * Object.keys(state.members).length;
  const todaySleep = (ws.sleepLog || {})[dayKey()];
  h += '<div class="card"><div class="row spread"><b>😴 ' + (live ? 'אתגר יומי: שינה' : 'שינה') + '</b>' +
    (!live ? '' : todaySleep
      ? '<span class="chip" style="color:var(--ok)">הלילה: ' + todaySleep.h + ' שע\'' + (todaySleep.xp ? ' +' + todaySleep.xp + ' XP' : '') + ' ✔</span>'
      : '<button class="btn" onclick="doSleep()">+ דיווח שינה</button>') + '</div>' +
    (live && todaySleep ? '<div class="row" style="margin-top:6px"><button class="chip" onclick="doSleep()">עדכון הדיווח</button></div>' : '') +
    // הלילות שלי השבוע — מעקב אישי יומי
    '<div class="tiny" style="margin-top:9px">' + (live ? 'הלילות שלי השבוע:' : 'הלילות שלי באותו שבוע:') + '</div>' +
    '<div class="row" style="gap:4px;margin-top:4px">' + DAY_LETTERS.map((L, i) => {
      const dk2 = dayKey(new Date(weekStartTs + i * 864e5));
      const e = (ws.sleepLog || {})[dk2];
      const stl = !e ? 'opacity:.4' : e.h >= 8 ? 'border-color:var(--ac);color:var(--ac);background:rgba(255,210,63,.14)' : e.h >= SLEEP_NIGHT_MIN ? 'border-color:var(--ok);color:var(--ok)' : 'opacity:.75';
      return '<div style="flex:1;text-align:center"><div class="tiny">' + L + '</div>' +
        '<div class="chip" style="width:100%;justify-content:center;padding:3px 0;border:1px solid var(--line);' + stl + '">' + (e ? e.h : '·') + '</div></div>';
    }).join('') + '</div>' +
    '<div class="row spread" style="margin-top:9px"><span class="muted">אני</span><span class="tiny">' + mySleep + ' / ' + SLEEP_WEEK_GOAL + ' שע\' · 56 = מושלם</span></div>' +
    '<div class="mbar"><i style="width:' + Math.min(100, (mySleep / SLEEP_WEEK_GOAL) * 100) + '%;background:var(--ac)"></i></div>' +
    '<div class="row spread" style="margin-top:7px"><span class="muted">הקבוצה</span><span class="tiny">' + gSleep + ' / ' + sleepGroupGoal + ' שע\'</span></div>' +
    '<div class="mbar"><i style="width:' + Math.min(100, (gSleep / sleepGroupGoal) * 100) + '%;background:#b388ff"></i></div>' +
    (live ? '<div class="tiny" style="margin-top:6px">7 שע\' ומעלה בלילה = XP · 8 = מקסימום (יותר מזה לא נספר)</div>' : '') +
    (wi.groupSleepBonusDone ? '<div class="chip" style="margin-top:8px;color:var(--ok)">😴 יעד השינה הקבוצתי הושג! +20 לכולם</div>' : '') + '</div>';

  // האתגר היומי (למשל: מתחת ל-100 גרם פחמימות)
  const habits = weekHabits(w);
  if (habits.length) {
    h += '<div class="card"><div class="row spread"><b>🥦 ' + (live ? 'אתגרים יומיים' : 'אתגרים יומיים') + '</b>' +
      '<span class="tiny">' + habTotal(ws) + '/' + (7 * habits.length) + ' ימים</span></div>' +
      habits.map((txt, i) => {
        const hd = habDays(ws, i), done = hd.includes(dayKey());
        return '<div style="margin-top:' + (i ? 14 : 10) + 'px;padding-top:' + (i ? 12 : 0) + 'px;' + (i ? 'border-top:1px dashed rgba(255,255,255,.12)' : '') + '">' +
          '<div class="row spread"><span style="font-weight:700">' + esc(txt) + '</span><span class="tiny">' + hd.length + '/7</span></div>' +
          (!live ? '' : done
            ? '<div class="row" style="margin-top:7px"><span class="chip" style="color:var(--ok)">בוצע היום ✔ +10</span><button class="chip" onclick="doHabit(false,' + i + ')">ביטול</button></div>'
            : '<button class="btn" style="width:100%;margin-top:7px" onclick="doHabit(true,' + i + ')">עמדתי בזה היום! +10 ✅</button>') +
          '</div>';
      }).join('') + '</div>';
  }

  // משימת בונוס
  if (wi.bonus) {
    const claimed = ws.bonusClaim;
    h += '<div class="card"><div class="row spread"><div><b>🎯 משימת הבונוס של השבוע</b><div class="muted" style="margin-top:3px">' + esc(wi.bonus) + '</div></div>' +
      (claimed ? '<span class="chip" style="color:var(--ok)">✔ בוצע</span>'
        : live ? '<button class="btn" onclick="doClaimBonus()">עשיתי! +20</button>' : '<span class="chip" style="opacity:.6">לא בוצע</span>') + '</div></div>';
  }

  if (live) h += '<button class="btn primary big" onclick="nav(\'checkin\')" style="margin-bottom:12px">💪 דיווח אימון</button>';

  // תקציר פיד
  const last = live ? state.feed.slice(-3) : [];
  if (last.length) {
    h += '<div class="card"><div class="row spread" style="margin-bottom:8px"><b>💬 קורה עכשיו</b>' +
      '<button class="chip" onclick="nav(\'feed\')">לפיד המלא ←</button></div>' +
      last.map(f => {
        const m = f.uid ? state.members[f.uid] : null;
        if (f.type === 'system') return '<div class="tiny" style="margin:5px 0">' + esc(f.text) + '</div>';
        if (f.type === 'checkin') { const a = actById(f.activity); return '<div class="tiny" style="margin:5px 0">' + a.e + ' <b>' + esc(m ? m.name : '') + '</b> — ' + a.n + ' ' + f.minutes + ' דק\'</div>'; }
        return '<div class="tiny" style="margin:5px 0">💬 <b>' + esc(m ? m.name : '') + ':</b> ' + esc(f.text).slice(0, 60) + '</div>';
      }).join('') + '</div>';
  }
  return h + navHTML();
}

function feedHTML() {
  state.seenTs = Date.now();
  try { localStorage.setItem('fitordie_seen', state.seenTs); } catch (e) {}
  let lastDay = '';
  const items = state.feed.map(f => {
    let h = '';
    const dk = dayKey(new Date(f.ts));
    if (dk !== lastDay) { lastDay = dk; h += '<div class="fdate">' + fmtDate(f.ts) + '</div>'; }
    if (f.type === 'system') return h + '<div class="fsys">' + esc(f.text) + '</div>';
    const m = state.members[f.uid] || {name:'?', color:'#888', emoji:'👤', xp:0};
    const mine = f.uid === state.me;
    const reacts = reactionsHTML(f);
    if (f.type === 'checkin') {
      const a = actById(f.activity);
      return h + '<div class="fitem ' + (mine?'mine':'') + '"><div class="fhead">' + avatarHTML(m,1) + ' ' + esc(m.name) + '</div>' +
        '<div class="ckcard" style="--c:' + m.color + '"><div class="big">' + a.e + ' ' + a.n + ' · ' + f.minutes + ' דק\'</div>' +
        (f.text ? '<div class="muted" style="margin-top:3px">' + esc(f.text) + '</div>' : '') +
        (f.photo ? '<img class="ckphoto" src="' + f.photo + '" onclick="viewPhoto(\'' + f.id + '\')">' : '') +
        '<div class="ftime">' + fmtTime(f.ts) + '</div></div>' + reacts + '</div>';
    }
    return h + '<div class="fitem ' + (mine?'mine':'') + '">' +
      (!mine ? '<div class="fhead">' + avatarHTML(m,1) + ' ' + esc(m.name) + '</div>' : '') +
      '<div class="bubble">' +
      (f.photo ? '<img class="ckphoto" src="' + f.photo + '" onclick="viewPhoto(\'' + f.id + '\')">' : '') +
      (f.text ? esc(f.text) : '') +
      '<div class="ftime">' + fmtTime(f.ts) + '</div></div>' + reacts + '</div>';
  }).join('');
  return topbarHTML() + '<div class="feed" id="feedList">' + (items || '<div class="fsys">עוד אין כלום — תהיו הראשונים! 🎬</div>') + '</div>' +
    '<div class="msgbar"><button onclick="$(\'feedPhoto\').click()" title="שיתוף תמונה מהאימון">📷</button>' +
    '<input id="feedPhoto" type="file" accept="image/*" style="display:none" onchange="feedPhotoSend(this)">' +
    '<input id="msgIn" placeholder="כתבו משהו לקבוצה..." onkeydown="if(event.key===\'Enter\')doSend()">' +
    '<button onclick="doSend()">📨</button></div>' + navHTML();
}
function reactionsHTML(f) {
  const rx = f.reactions || {};
  const chips = REACTIONS.map((e, i) => {
    const arr = rx['r'+i] || [];
    if (!arr.length) return '';
    return '<button class="' + (arr.includes(state.me)?'on':'') + '" onclick="doReact(\'' + f.id + '\',' + i + ')">' + e + ' ' + arr.length + '</button>';
  }).join('');
  const picker = state.reactFor === f.id
    ? '<div class="rpick">' + REACTIONS.map((e, i) => '<button onclick="doReact(\'' + f.id + '\',' + i + ')">' + e + '</button>').join('') + '</div>'
    : '';
  return '<div class="reacts">' + chips + '<button onclick="toggleReactPick(\'' + f.id + '\')">🙂+</button></div>' + picker;
}

    '<div class="row" style="gap:8px;flex-wrap:wrap"><span class="chip" style="font-size:1.05em;letter-spacing:3px;font-weight:800">' + esc(state.challenge.code) + '</span>' +

    navHTML();

  }

    }, {min:0, days:0, sleep:0, habit:0, habMax:0, goals:0, goalSum:0});
    const n = selUnit.weeks.length;
    h += '<div class="tiny" style="margin-bottom:6px">סיכום חודשי · ' + n + ' שבועות</div>' +
      '<div class="row" style="flex-wrap:wrap;gap:8px">' +
      '<span class="chip">💪 ' + agg.min + '/' + agg.goalSum + ' דק\'</span>' +
      '<span class="chip">📅 ' + agg.days + ' ימים פעילים</span>' +
      '<span class="chip">😴 ' + (Math.round(agg.sleep * 10) / 10) + '/' + (SLEEP_WEEK_GOAL * n) + ' שע\'</span>' +

  // מדידות גוף: משקל + היקף זרוע/בטן/מותניים — משותפים לקבוצה (עריכה רק לבעלים)

  const wis = meas.filter(e => e.weight != null).map(e => ({date: e.date, kg: e.weight}));

  h += '<div class="card"><div class="row spread"><b>📏 מדידות גוף</b><span class="tiny">🤝 משותף לקבוצה</span></div>' +

    (m.goalWeight ? '<span class="chip" style="color:var(--ok)">יעד: ' + m.goalWeight + '</span>' : '') + '</div>' +

      '<div class="tiny">' + (mine ? 'הוסיפו מדידות כדי לראות גרף התקדמות' : 'אין עדיין מספיק מדידות לגרף') + '</div>') +
    CIRCS.map(f => {
      const startV = m[f.s];
      const pts = meas.filter(e => e[f.id] != null).map(e => ({date: e.date, v: e[f.id]}));
      const last = pts.length ? pts[pts.length-1].v : startV;
      if (last == null) return '';
      const delta = (startV != null && pts.length) ? Math.round((last - startV) * 10) / 10 : null;
      return '<div class="row" style="gap:10px;margin-top:8px;flex-wrap:wrap"><b style="font-size:.9em">' + f.e + ' ' + f.n + '</b>' +

        (pts.length ? '<span class="chip" style="color:var(--ac)">עכשיו: ' + last + '</span>' : '') +
