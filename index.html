        (pts.length >= 2 ? miniChartSVG(pts) : '');
    }).join('') +
    (mine ? '<div class="row" style="margin-top:12px;gap:8px">' +
      '<button class="btn primary grow" onclick="state.measForm=!state.measForm;state.editWeights=false;render()">+ מדידה חדשה 📏</button>' +
      '<button class="btn" onclick="state.editWeights=!state.editWeights;state.measForm=false;render()">⚙️ התחלה ויעד</button></div>' +
      (mine && !getMeasures(m).length && !m.startWeight && !m.startArm && !m.startBelly && !m.startWaist && !state.measForm && !state.editWeights
        ? '<div class="tiny" style="margin-top:8px;color:var(--ac)">👋 עוד אין מדידות — לחצו "+ מדידה חדשה" והזינו נקודת פתיחה (משקל והיקפים)</div>' : '') +
      (state.measForm
        ? '<div class="tiny" style="margin-top:10px"><b>מדידה חדשה:</b> מזינים את מה שמדדתם עכשיו — אפשר גם רק שדה אחד. כל מדידה נוספת לגרף לפי התאריך.</div>' +
          '<div class="row" style="margin-top:6px;flex-wrap:wrap;gap:6px">' +
          '<div class="field" style="flex:1;min-width:44%"><label>⚖️ משקל (ק"ג)</label><input id="mW" type="number" step="0.1" inputmode="decimal" placeholder="למשל 92.5"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>💪 היקף זרוע (ס"מ)</label><input id="mArm" type="number" step="0.5" inputmode="decimal" placeholder="למשל 36"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>⚪ היקף בטן (ס"מ)</label><input id="mBelly" type="number" step="0.5" inputmode="decimal" placeholder="למשל 104"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>📏 היקף מותניים (ס"מ)</label><input id="mWaist" type="number" step="0.5" inputmode="decimal" placeholder="למשל 98"></div></div>' +
          '<button class="btn primary" style="width:100%" onclick="doMeasureInline()">שמירת המדידה 📏</button>'
        : '') +
      (state.editWeights
        ? '<div class="tiny" style="margin-top:10px"><b>נקודת הפתיחה והיעד:</b> אלה הערכים שמהם נמדדת ההתקדמות שלך (ה"התחלה" בכרטיס). יעד מוגדר רק למשקל.</div>' +
          '<div class="row" style="margin-top:6px;flex-wrap:wrap;gap:6px">' +
          '<div class="field" style="flex:1;min-width:44%"><label>⚖️ משקל התחלה (ק"ג)</label><input id="wStart" type="number" step="0.1" inputmode="decimal" value="' + (m.startWeight || '') + '" placeholder="—"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>🎯 משקל היעד (ק"ג)</label><input id="wGoal" type="number" step="0.1" inputmode="decimal" value="' + (m.goalWeight || '') + '" placeholder="—"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>💪 זרוע התחלה (ס"מ)</label><input id="wArmS" type="number" step="0.5" inputmode="decimal" value="' + (m.startArm || '') + '" placeholder="—"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>⚪ בטן התחלה (ס"מ)</label><input id="wBellyS" type="number" step="0.5" inputmode="decimal" value="' + (m.startBelly || '') + '" placeholder="—"></div>' +
          '<div class="field" style="flex:1;min-width:44%"><label>📏 מותניים התחלה (ס"מ)</label><input id="wWaistS" type="number" step="0.5" inputmode="decimal" value="' + (m.startWaist || '') + '" placeholder="—"></div></div>' +

        : '') : '') + '</div>';

  h += '<div class="card"><div class="row spread"><b>📷 לפני ← אחרי</b><span class="tiny">🤝 משותף לקבוצה</span></div>' +

/* מדידות גוף: משקל + היקפים. רשומה = {date, weight?, arm?, belly?, waist?} */
const CIRCS = [{id:'arm', n:'זרוע', e:'💪', s:'startArm'}, {id:'belly', n:'בטן', e:'⚪', s:'startBelly'}, {id:'waist', n:'מותניים', e:'📏', s:'startWaist'}];
function getMeasures(m) {
  const arr = (m.measures && m.measures.length) ? m.measures.slice()
    : (m.weighIns || []).map(w => ({date: w.date, weight: w.kg}));   // תאימות למבנה הישן
  return arr.sort((a, b) => a.date < b.date ? -1 : 1);
}
/* ציר X לפי תאריך אמיתי — רואים מתי כל מדידה קרתה */
function fmtDM(dateStr) { const d = new Date(Date.parse(dateStr)); return d.getUTCDate() + '.' + (d.getUTCMonth() + 1); }
function timeX(dates, W, pad) {
  const t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]);
  const span = Math.max(t1 - t0, 864e5);
  return i => pad + (W - 2 * pad) * ((Date.parse(dates[i]) - t0) / span);
}
/* בוחר עד 4 אינדקסים מפוזרים לתוויות תאריך, בלי צפיפות */
function labelIdx(n) {
  if (n <= 4) return Array.from({length: n}, (_, i) => i);
  return [0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1];
}
function miniChartSVG(pts) {   // pts: [{date, v}]
  const W = 340, H = 60, p = 12, vals = pts.map(x => x.v);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 1) { mn -= 0.5; mx += 0.5; }
  const X = timeX(pts.map(x => x.date), W, p);
  const Y = v => (H - 16) - (H - 16 - p) * ((v - mn) / (mx - mn));
  return '<svg class="svgchart" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="' + p + '" y1="' + (H - 14) + '" x2="' + (W - p) + '" y2="' + (H - 14) + '" stroke="rgba(255,255,255,.15)" stroke-width="1"/>' +
    '<polyline points="' + pts.map((x, i) => X(i) + ',' + Y(x.v)).join(' ') + '" fill="none" stroke="var(--ac2)" stroke-width="2" stroke-linejoin="round"/>' +
    pts.map((x, i) => '<circle cx="' + X(i) + '" cy="' + Y(x.v) + '" r="3" fill="var(--ac2)"/>').join('') +
    labelIdx(pts.length).map(i => '<text x="' + X(i) + '" y="' + (H - 3) + '" fill="var(--tx3)" font-size="8.5" text-anchor="middle">' + fmtDM(pts[i].date) + '</text>').join('') +
    '</svg>';
}
function weightChartSVG(p, wis) {   // wis: [{date, kg}]
  const W = 340, H = 162, pad = 26;
  const vals = wis.map(w => w.kg).concat(p.goalWeight ? [p.goalWeight] : []).concat(p.startWeight ? [p.startWeight] : []);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 2) { mn -= 1; mx += 1; }
  const X = timeX(wis.map(w => w.date), W, pad);
  const Y = v => (H - 22) - (H - 22 - pad) * ((v - mn) / (mx - mn));
  return '<svg class="svgchart" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="' + pad + '" y1="' + (H - 18) + '" x2="' + (W - pad) + '" y2="' + (H - 18) + '" stroke="rgba(255,255,255,.18)" stroke-width="1"/>' +
    (p.goalWeight ? '<line x1="' + pad + '" y1="' + Y(p.goalWeight) + '" x2="' + (W - pad) + '" y2="' + Y(p.goalWeight) + '" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.5" opacity=".7"/>' +
      '<text x="' + (W - pad) + '" y="' + (Y(p.goalWeight) - 5) + '" fill="var(--ok)" font-size="10" text-anchor="end">יעד ' + p.goalWeight + '</text>' : '') +
    '<polyline points="' + wis.map((w, i) => X(i) + ',' + Y(w.kg)).join(' ') + '" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>' +
    wis.map((w, i) => '<circle cx="' + X(i) + '" cy="' + Y(w.kg) + '" r="4" fill="var(--ac)"/>' +
      '<text x="' + X(i) + '" y="' + (Y(w.kg) - 9) + '" fill="var(--tx2)" font-size="10" text-anchor="middle">' + w.kg + '</text>').join('') +
    labelIdx(wis.length).map(i => '<text x="' + X(i) + '" y="' + (H - 5) + '" fill="var(--tx3)" font-size="9" text-anchor="middle">' + fmtDM(wis[i].date) + '</text>').join('') +
    '</svg>';
}

/* ===== דף הדמות — גיליון RPG בסגנון דיאבלו ===== */
/* דיוקן שלא נטען (למשל תמונה חסרה) — נפילה חיננית לאייקון האפליקציה */
function imgFallback(el) { el.onerror = null; el.src = 'icons/icon-192.png'; el.style.opacity = '.5'; }
/* דירוג נדירות בסגנון משחקי גאצ'ה — עולה עם הדרגה */
function rarityOf(lv) { return lv >= 6 ? ['UR', '#ff7ab6'] : lv >= 4 ? ['SSR', '#ffd23f'] : lv >= 2 ? ['SR', '#38b6ff'] : ['R', '#aab3c8']; }
function explainRarity() {
  const lv = levelIndex((state.members[state.profileUid || state.me] || {}).xp || 0);
  showToast('דירוג נדירות: R (רגיל) → SR (נדיר) → SSR (אגדי) → UR (אולטרה). כרגע: ' + rarityOf(lv)[0], 'gold');
}
function starsHTML(lv, size) {
  return '<span style="font-size:' + (size || 1.1) + 'em;letter-spacing:2.5px;color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.55)">' +
    '✦'.repeat(lv + 1) + '<span style="opacity:.22;text-shadow:none">' + '✦'.repeat(7 - lv) + '</span></span>';
}
function sheetHTML() {
  const uid = state.profileUid || state.me, m = state.members[uid];
  if (!m) return topbarHTML() + '<div class="card">לא נמצא</div>' + navHTML();
  const mine = uid === state.me;
  const lv = levelIndex(m.xp || 0), cls = classById(m.avatar), rar = rarityOf(lv);
  const stats = heroStats(m), t = heroTotals(m);
  const pet = petById(m.pet) || PETS[0];
  let h = topbarHTML() + '<h2>📜 דף הדמות</h2>';

  // כותרת: דיוקן, מחלקה, דרגה, כוכבים
  h += '<div class="card center">' +
    '<div class="herowrap" style="margin:6px 0 10px">' + heroDuo(m, 250, 0.5) + '</div>' +
    '<div style="font-weight:900;font-size:1.35em;margin-top:6px">' + esc(m.name) + '</div>' +
    '<div class="row" style="justify-content:center;gap:7px;margin-top:6px;flex-wrap:wrap">' +
    '<button class="chip" style="color:' + rar[1] + ';border:1.5px solid ' + rar[1] + ';font-weight:900;letter-spacing:1px" onclick="explainRarity()">' + rar[0] + ' ⓘ</button>' +
    (cls ? '<span class="chip">' + cls.e + ' ' + cls.n + '</span>' : '') +
    '<span class="chip">' + LEVELS[lv].e + ' דרגה ' + (lv+1) + ' · ' + LEVELS[lv].n + '</span>' +
    '<span class="chip">💥 ' + (m.xp || 0).toLocaleString('en-US') + '</span></div>' +
    '<div style="margin-top:6px">' + starsHTML(lv) + '</div></div>';

  // תכונות — נגזרות מנתוני הכושר האמיתיים
  h += '<div class="card"><div class="row spread"><b>📊 תכונות</b><span class="tiny">נגזרות מהביצועים שלך</span></div>' +
    STATS.map(s => {
      const v = stats[s.id], isPrime = cls && cls.prime === s.id;
      return '<div class="statrow"><b>' + s.e + ' ' + s.n + (isPrime ? ' ★' : '') + '</b>' +
        '<span class="val">' + v + '</span><span class="statbar"><i style="width:' + Math.round((v - STAT_MIN) / (STAT_MAX - STAT_MIN) * 100) + '%"></i></span>' +
        '<span class="tiny" style="width:78px;text-align:start">' + s.src + '</span></div>';
    }).join('') +
    (cls ? '<div class="tiny" style="margin-top:8px">★ התכונה הראשית של ' + cls.n + '</div>' : '') + '</div>';

  // ציוד — משתדרג לפי הישגים אמיתיים
  h += '<div class="card"><div class="row spread"><b>🎒 ציוד</b><span class="tiny">משתדרג עם ההישגים</span></div>' +
    '<div class="gearg">' + SLOTS.map(sl => {
      const locked = lv < sl.lv;
      const plus = locked ? 0 : gearPlus(m, sl.id);
      const tier = itemTier(plus);
      const nm = sl.id === 'weapon' ? (cls ? cls.wp : 'נשק הגיבור')
        : sl.id === 'armor' ? (cls ? cls.ar : 'שריון הגיבור') : SLOT_NAMES[sl.id];
      return '<div class="gitem ' + (locked ? 'locked' : '') + '" style="' + (!locked && plus > 0 ? 'border-color:' + tier.c : '') + '">' +
        '<span class="ic">' + (locked ? '🔒' : sl.e) + '</span><span>' +
        '<span class="nm" style="color:' + (locked ? '' : tier.c) + '">' + (locked ? sl.n : esc(nm)) + (locked || !plus ? '' : ' +' + plus) + '</span>' +
        '<div class="pl" style="color:' + tier.c + '">' + (locked ? 'נפתח בדרגה ' + (sl.lv + 1) : tier.n + ' · דרגת ציוד ' + tier.lvl + '/5') + '</div></span></div>';
    }).join('') + '</div>' +
    '</div>';

  // יכולות ולחשים
  if (cls) {
    h += '<div class="card"><div class="row spread"><b>' + (['wizard','cleric','druid','warlock','bard'].includes(cls.id) ? '📜 לחשים' : '⚡ יכולות') + '</b>' +
      '<span class="tiny">' + (lv + 1) + '/8 נפתחו</span></div>' +
      cls.ab.map((a, i) => '<div class="abil ' + (i <= lv ? 'on' : 'off') + '">' + (i <= lv ? '✔' : '🔒') + ' ' + esc(a) +
        '<span class="lvtag">' + (i <= lv ? 'זמין' : 'דרגה ' + (i + 1)) + '</span></div>').join('') + '</div>';
  }

  // חיית המלווה
  const plv = petLevel(m);
  h += '<div class="card"><div class="row spread"><b>🐾 חיית המלווה</b><span class="tiny">גדלה איתך · עד דרגה ' + PET_MAX_LEVEL + '</span></div>' +
    '<div class="petcard" style="margin-top:9px">' +
    '<img class="petimg" src="avatars/' + pet.id + '-' + (1 + (lv % 3)) + '.jpg" alt="" onerror="imgFallback(this)">' +
    '<div class="grow"><b style="font-size:1.15em">' + pet.e + ' ' + pet.n + '</b>' +
    '<div class="tiny">דרגה ' + plv + '/' + PET_MAX_LEVEL + ' · ' + (plv >= 9 ? 'אגדית 🌟' : plv >= 6 ? 'מיומנת' : plv >= 3 ? 'מתאמנת' : 'גור') + '</div>' +
    '<div class="mbar" style="margin-top:6px"><i style="width:' + Math.round(plv / PET_MAX_LEVEL * 100) + '%;background:linear-gradient(90deg,var(--ac),var(--ac2))"></i></div>' +
    '<div class="tiny" style="margin-top:4px">המראה שלה משתנה ככל שאתם עולים בדרגות</div></div></div>' +
    (mine ? '<div class="pgrid">' + PETS.map(p => {
      const locked = lv < p.lv;
      return '<button class="' + (m.pet === p.id ? 'sel' : '') + (locked ? ' lock' : '') + '" onclick="pickPet(\'' + p.id + '\',' + p.lv + ')">' +
        '<img src="avatars/' + p.id + '-1.jpg" alt="" onerror="imgFallback(this)">' + p.n +
        (locked ? '<div class="tiny">🔒 דרגה ' + (p.lv + 1) + '</div>'
                : '<div class="tiny" style="color:var(--ac)">דרגה ' + (m.pet === p.id ? plv : 1) + '/' + PET_MAX_LEVEL + '</div>') + '</button>';
    }).join('') + '</div>' : '') + '</div>';

  h += '<button class="btn" style="width:100%;margin-bottom:10px" onclick="openProfile(\'' + uid + '\')">📈 למעקב הנתונים והמדידות ←</button>';
  if (mine) h += '<button class="btn" style="width:100%" onclick="nav(\'settings\')">🎽 שינוי מחלקה, דיוקן ומראה</button>';
  return h + navHTML();
}

/* הפאנל השבועי — המפגש הפיזי של הקבוצה: אצל מי, מה המוטיב, ומי מביא מה */
function panelHTML() {
  const w = curWeek(), wi = weekInfo(w);
  const panel = wi.panel, brings = wi.brings;
  let h = topbarHTML() + '<h2>🥗 הפאנל השבועי <span class="muted" style="font-weight:400;font-size:.7em">שבוע ' + (w+1) + '</span></h2>' +
    '<div class="tiny" style="margin:-4px 0 12px">המפגש הפיזי של הקבוצה — כל אחד מביא משהו בריא 🙂</div>';
  // פאנל CHEAT — כשהקבוצה צברה מספיק XP
  if (cheatPending() > 0) {
    h += '<div class="card" style="border-color:var(--ac);box-shadow:0 0 14px rgba(255,210,63,.3)"><b>🍕 זה פאנל CHEAT!</b>' +
      '<div class="muted" style="margin:6px 0 10px">הקבוצה צברה ' + groupXpTotal() + ' XP — הפאנל הזה חופשי מהחוקים: פיצה, בורגר, מה שבא 🍔🍟</div>' +
      '<button class="btn primary" onclick="doClaimCheat()">חגגנו! סוגרים את הצ\'יט ✔</button></div>';
  }
  if (panel && state.members[panel.host]) {
    const host = state.members[panel.host];
    h += '<div class="card weekcard"><div class="row" style="gap:12px">' + avatarHTML(host, 2) +
      '<div><div class="tiny">מתארחים אצל</div><b style="font-size:1.2em">' + esc(host.name) + '</b></div></div>' +
      '<div class="row" style="gap:8px;margin-top:9px;flex-wrap:wrap">' +
      (panel.when ? '<span class="chip">🕒 ' + esc(panel.when) + '</span>' : '') +
      (panel.location ? '<span class="chip">📍 ' + esc(panel.location) + '</span>' : '') +
      (panel.motif ? '<span class="chip">🎪 ' + esc(panel.motif) + '</span>' : '') + '</div></div>';
  } else {
    h += '<div class="card center muted">עוד לא נקבע פאנל השבוע — לחצו על עריכה וקבעו 🤗</div>';
  }
  h += '<div class="card"><b>🧺 מי מביא מה</b>' +
    Object.values(state.members).map(m => {
      const mine = m.uid === state.me, val = brings[m.uid] || '';
      return '<div class="row" style="margin-top:10px">' + avatarHTML(m, 1) +
        (mine
          ? '<div class="grow"><input id="bringIn" value="' + esc(val) + '" placeholder="מה להביא? (משהו בריא 🙂)"></div><button class="btn" onclick="doBring()">שמירה</button>'
          : '<div class="grow"><b>' + esc(m.name) + '</b> — ' + (val ? esc(val) : '<span class="tiny">עוד לא נרשם</span>') + '</div>') +
        '</div>';
    }).join('') + '</div>';
  // קביעת הפאנל — סמכות של קפטן השבוע (והמארגן כגיבוי)
  const canEditPanel = wi.captainUid === state.me || state.challenge.organizerUid === state.me;
  if (canEditPanel)
    h += '<button class="btn" style="width:100%;margin-bottom:12px" onclick="state.panelEdit=!state.panelEdit;state.panelDraft=null;render()">✏️ ' + (panel ? 'עריכת פרטי הפאנל' : 'קביעת הפאנל השבועי') + '</button>';
  else
    h += '<div class="tiny center" style="margin-bottom:12px">⚡ רק קפטן השבוע (' + esc((state.members[wi.captainUid] || {name:'?'}).name) + ') קובע את פרטי הפאנל — אבל כל אחד רושם מה הוא מביא 👇</div>';
  if (state.panelEdit && canEditPanel) {
    const d = state.panelDraft || (state.panelDraft = {host: (panel && panel.host) || wi.captainUid, motif: (panel && panel.motif) || '', when: (panel && panel.when) || '', location: (panel && panel.location) || ''});
    h += '<div class="card"><b>✏️ עריכת הפאנל</b>' +
      '<div class="tiny" style="margin:8px 0 4px">אצל מי מתארחים?</div><div class="chips">' +
      Object.values(state.members).map(m => '<button class="' + (d.host === m.uid ? 'sel' : '') + '" onclick="panelHost(\'' + m.uid + '\')">' + m.emoji + ' ' + esc(m.name) + '</button>').join('') + '</div>' +
      '<div class="field"><label>מתי?</label><input id="panelWhen" value="' + esc(d.when) + '" placeholder="למשל: חמישי 20:00"></div>' +
      '<div class="field"><label>מיקום (אם לא בבית המארח)</label><input id="panelLoc" value="' + esc(d.location) + '" placeholder="למשל: הפארק ליד הבית של רון"></div>' +
      '<div class="field"><label>מוטיב / נושא המפגש</label><input id="panelMotif" value="' + esc(d.motif) + '" placeholder="למשל: ערב שייקים אחרי אימון"></div>' +
      '<button class="btn primary" onclick="doPanelSave()">פרסום הפאנל 📣</button></div>';
  }
  return h + navHTML();
}

function settingsHTML() {
  const me = state.members[state.me];
  const d = state.editProfile || (state.editProfile = me
    ? {name: me.name, emoji: me.emoji, color: me.color, avatar: me.avatar || 'fighter'}
    : {name:'', emoji:'⚔️', color:MEMBER_COLORS[0], avatar:'fighter'});
  let h = topbarHTML() + '<h2>הגדרות ⚙️</h2>';
  if (me) {
    h += '<div class="card"><b>✏️ עריכת הכרטיס שלי</b>' +
      '<div class="field" style="margin-top:8px"><label>שם</label><input id="setName" value="' + esc(d.name) + '"></div>' +
      '<div class="field"><label>דמות</label>' + avatarPickerHTML(d, me.xp) + '</div>' +
      '<div class="field"><label>צבע אישי</label><div class="colorrow">' + MEMBER_COLORS.map(c => '<button class="' + (d.color===c?'sel':'') + '" style="background:' + c + '" onclick="obSet(\'color\',\'' + c + '\')"></button>').join('') + '</div></div>' +
      '<button class="btn primary" onclick="doSaveProfile()">שמירה</button></div>';
    // בחירת דיוקן — 6 ציורים לכל מחלקה
    h += '<div class="card"><div class="row spread"><b>🖼️ הדיוקן שלי</b><span class="tiny">6 ציורים לכל מחלקה</span></div>' +
      '<div class="field" style="margin-top:8px">' +
      '<div class="tiny" style="margin-bottom:6px">הגרסאות של "' + esc((classById(d.avatar) || {n:''}).n) + '" — הקישו לבחירה:</div>' +
      '<div class="row" style="gap:6px;flex-wrap:wrap">' + Array.from({length: portraitCount(d.avatar)}, (_, i) => {
        const p = 'avatars/' + d.avatar + '-' + (i + 1) + '.jpg';
        return '<img src="' + p + '" alt="" loading="lazy" onerror="imgFallback(this)" onclick="pickPortrait(\'' + p + '\')" ' +
          'style="width:' + (portraitCount(d.avatar) > 3 ? '31%' : '31%') + ';aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;border:3px solid ' + (me.avatarImg === p ? 'var(--ac)' : 'rgba(255,255,255,.15)') + '">';
      }).join('') + '</div>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:9px">' +
      '<button class="btn" onclick="$(\'avImgIn\').click()">📤 העלאת דיוקן משלי</button></div>' +
      '<input id="avImgIn" type="file" accept="image/*" style="display:none" onchange="avatarImgUpload(this)">' +
      '<div class="tiny" style="margin-top:5px">הדיוקן מוצג בכרטיס ובקבוצה בתוך מסגרת לפי הנדירות שלך. אפשר גם להעלות ציור משלכם — תמונה מרובעת עובדת הכי טוב.</div></div></div>';
  }
  // הגדרות האתגר — למארגן בלבד
  const ch = state.challenge;
  if (ch && me && ch.organizerUid === state.me) {
    h += '<div class="card"><b>🏆 הגדרות האתגר (מארגן)</b>' +
      '<div class="field" style="margin-top:8px"><label>שם האתגר</label><input id="chEditName" value="' + esc(ch.name) + '"></div>' +
      '<div class="field"><label>יעד שבועי בסיסי לאדם (דק\')</label><input id="chEditGoal" type="number" min="' + GOAL_MIN_RANGE[0] + '" max="' + GOAL_MIN_RANGE[1] + '" step="10" value="' + ch.defaultGoalMin + '"></div>' +
      '<div class="tiny" style="margin:10px 0 4px"><b>אתגרים יומיים — ברירת מחדל</b><br>אלה יחולו על שבוע שהקפטן לא קבע בו אתגרים משלו. הקפטן משנה אותם כל שבוע ממסך הבית.</div>' +
      Array.from({length: MAX_HABITS}, (_, i) =>
        '<div class="field"><input id="chEditHabit' + i + '" value="' + esc(challengeHabits()[i] || '') +
        '" placeholder="אתגר ' + (i+1) + (i < 2 ? ' — ' + esc(DEFAULT_DAILY_HABITS[i]) : ' (ריק = כבוי)') + '"></div>').join('') +
      '<div class="field"><label>משך האתגר (שבועות, עד 52 = שנה)</label><input id="chEditWeeks" type="number" min="2" max="52" value="' + ch.weeksTotal + '"></div>' +
      '<div class="field"><label>תאריך פתיחה (תחילת שבוע 1)</label><input id="chEditStart" type="date" value="' + ch.startDate + '">' +
      '<div class="tiny" style="margin-top:4px">שינוי התאריך מזיז את מספור השבועות של כל הקבוצה</div></div>' +
      '<button class="btn primary" onclick="doSaveChallenge()">שמירת הגדרות האתגר</button>' +
      '<button class="btn danger" style="margin-top:10px;width:100%" onclick="doResetGroup()">🔄 איפוס נתוני כל הקבוצה</button>' +
      '<div class="tiny" style="margin-top:4px">האיפוס מוחק נקודות, תגים, דיווחים ופיד של כולם ומתחיל את האתגר מחדש מהיום. פרופילים ומדידות גוף נשמרים.</div></div>';
  }
  // מראה האפליקציה — אישי, לכל משתתף במכשיר שלו
  let myPick = null; try { myPick = localStorage.getItem('fitordie_theme'); } catch (e) {}
  h += '<div class="card"><div class="row spread"><b>🎨 מראה האפליקציה</b><span class="tiny">אישי — רק אצלך</span></div>' +
    '<div class="tiny" style="margin:6px 0 8px">ברירת המחדל היא ערכת הנושא שהקפטן בחר לשבוע. אפשר לקבוע מראה קבוע משלכם:</div>' +
    '<div class="themegrid">' +
    '<button class="' + (!myPick ? 'sel' : '') + '" style="background:linear-gradient(135deg,#2b1460,#ffd23f)" onclick="setMyTheme(\'\')">לפי השבוע 🔄</button>' +
    THEMES.map(t => '<button class="' + (myPick === t.id ? 'sel' : '') + '" style="background:linear-gradient(135deg,' + t.bg2 + ',' + t.ac + ')" onclick="setMyTheme(\'' + t.id + '\')">' + t.n + '</button>').join('') +
    '</div></div>';

  h += '<div class="card"><b>📲 התקנה על האייפון</b><ol class="steps" style="margin-inline-start:18px">' +
    '<li>פתחו את הכתובת הזו ב<b>ספארי</b></li>' +
    '<li>לחצו על כפתור השיתוף <b>⬆️</b> (ריבוע עם חץ למעלה)</li>' +
    '<li>גללו ובחרו <b>"הוסף למסך הבית"</b></li>' +
    '<li>מעכשיו האפליקציה על מסך הבית כמו כל אפליקציה 🎉</li></ol></div>';
  if (state.mode === 'demo') {
    h += '<div class="card"><b>🧪 מצב הדגמה</b><div class="tiny" style="margin:6px 0 10px">האפליקציה רצה עם נתונים מקומיים לדוגמה. כדי לחבר את הקבוצה האמיתית מקימים Firebase לפי המדריך SETUP-FIREBASE.md ומדביקים את ההגדרות בקובץ.</div>' +
      '<div class="row"><button class="btn" onclick="state.view=\'pickuser\';render()">🎭 החלפת דמות</button>' +
      '<button class="btn danger" onclick="if(confirm(\'לאפס את נתוני ההדגמה?\'))DemoStore.reset()">איפוס נתוני הדגמה</button></div></div>';
  } else {
    h += '<div class="card"><div class="row spread"><div><b>חשבון</b><div class="tiny">' + esc((state.authUser && state.authUser.email) || '') + '</div></div>' +
      '<button class="btn danger" onclick="if(confirm(\'לצאת מהחשבון?\'))Store.signOut()">יציאה</button></div></div>';
  }
  h += '<div class="tiny center" style="margin-top:16px">Fit or DIE! גרסה ' + APP_VERSION + ' 💀🔥</div>';
  return h + navHTML();
}

function netErrorHTML() {
  return splashHTML('') + '<div class="card center">לא הצלחנו לטעון את שירותי הענן 🌩️<br><span class="muted">בדקו את חיבור האינטרנט ונסו שוב</span><br><br><button class="btn primary" onclick="location.reload()">ניסיון חוזר</button></div>';
}

/* ===================== ניתוב ורינדור ===================== */
function render() {
  const v = state.view;
  document.body.dataset.view = state.booting ? 'boot' : v;   // מאפשר עיצוב פר-מסך (פריסת מחשב)
  let h;
  if (state.booting) h = splashHTML();
  else if (v === 'auth') h = authViewHTML();
  else if (v === 'join') h = joinViewHTML();
  else if (v === 'onboard') h = onboardHTML();
  else if (v === 'pickuser') h = pickUserHTML();
  else if (v === 'neterror') h = netErrorHTML();
  else if (!state.challenge || !state.members[state.me]) h = splashHTML();
  else if (v === 'checkin') h = checkinHTML();
  else if (v === 'feed') h = feedHTML();
  else if (v === 'panel') h = panelHTML();
  else if (v === 'sheet') h = sheetHTML();
  else if (v === 'group') h = groupHTML();
  else if (v === 'profile') h = profileHTML();
  else if (v === 'captain') h = captainHTML();
  else if (v === 'settings') h = settingsHTML();
  else h = homeHTML();
  if (state.sleepSheet) h += sleepSheetHTML();
  if (state.lightbox) h += '<div class="lightbox" onclick="state.lightbox=null;render()"><img src="' + state.lightbox + '"></div>';
  // שימור שדה קלט פעיל בין רינדורים (קריטי בצ'אט כשמגיעות הודעות תוך כדי הקלדה)
  const ae = document.activeElement;
  const keep = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.id

  if (entry.weight != null && !me.startWeight) patch.startWeight = entry.weight;
  if (entry.arm != null && !me.startArm) patch.startArm = entry.arm;
  if (entry.belly != null && !me.startBelly) patch.startBelly = entry.belly;
  if (entry.waist != null && !me.startWaist) patch.startWaist = entry.waist;
  try {
    await Store.addMeasure(entry);
    if (Object.keys(patch).length) await Store.saveShared(patch);
    render();
    showToast('נשמר! 📏', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doSetWeightsInline() {
  const g = id => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
  const patch = {};
  const s = g('wStart'), gl = g('wGoal'), ar = g('wArmS'), be = g('wBellyS'), wa = g('wWaistS');
  if (s != null && s >= 20 && s <= 400) patch.startWeight = s;
  if (gl != null && gl >= 20 && gl <= 400) patch.goalWeight = gl;
  if (ar != null && ar >= 15 && ar <= 100) patch.startArm = ar;
  if (be != null && be >= 40 && be <= 250) patch.startBelly = be;
  if (wa != null && wa >= 40 && wa <= 250) patch.startWaist = wa;
  if (!Object.keys(patch).length) { showToast('נא להזין ערכים', 'bad'); return; }
  state.editWeights = false;
  try {
    await Store.saveShared(patch);
    render();
    showToast('עודכן ✔', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
/* בחירת מחלקה/דמות — מגדירה גם את הדיוקן המתאים */
async function pickClass(id) {
  syncEditInputs();
  // דיוקן אקראי מבין הווריאציות — כך שלא כולם מקבלים את אותה תמונה
  const img = 'avatars/' + id + '-' + (1 + Math.floor(Math.random() * portraitCount(id))) + '.jpg';
  const emo = (classById(id) || {}).e || '🦸';       // הסמל נגזר מהמחלקה (אין יותר בורר סמל)
  state.editProfile.avatar = id;
  state.editProfile.avatarImg = img;
  state.editProfile.emoji = emo;
  render();
  if (!state.members[state.me]) return;            // בהרשמה עדיין אין כרטיס — יישמר בסיום
  try { await Store.saveShared({avatar: id, avatarImg: img, emoji: emo}); render(); }
  catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function pickPet(id, lvReq) {
  const lv = levelIndex(state.members[state.me].xp || 0);
  if (lv < lvReq) { showToast('🔒 ' + petById(id).n + ' נפתח בדרגה ' + (lvReq + 1) + ' (' + LEVELS[lvReq].n + ')', 'bad'); return; }
  try { await Store.saveShared({pet: id}); render(); showToast(petById(id).e + ' ' + petById(id).n + ' הצטרף אליך!', 'gold'); }
  catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function pickPortrait(path) {
  try {
    await Store.saveShared({avatarImg: path});
    render();
    showToast('הדיוקן נבחר! 🖼️✨', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function avatarImgUpload(inp) {
  if (!inp.files || !inp.files[0]) return;
  showToast('מכווץ תמונה... 🖼️');
  try {
    const data = await compressImage(inp.files[0], 340);
    await Store.saveShared({avatarImg: data});
    render();
    showToast('הדיוקן הועלה! 🖼️✨', 'gold');
  } catch (e) { showToast('לא הצלחנו לקרוא את התמונה', 'bad'); }
}
async function delPhoto(key) {
  if (!confirm('למחוק את התמונה?')) return;
  const patch = {}; patch[key] = null;
  try { await Store.saveShared(patch); render(); showToast('נמחק ✔'); }
  catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function clearAvatarImg() {
  await Store.saveShared({avatarImg: null});
  render();
  showToast('חזרנו לדמות המצוירת 🎨');
}
async function sharedPhoto(inp, key) {
  if (!inp.files || !inp.files[0]) return;
  showToast('מכווץ תמונה... 📷');
  try {
    const data = await compressImage(inp.files[0], 700);
    const patch = {}; patch[key] = data;
    await Store.saveShared(patch);
    if (state.mode === 'demo') render();
  } catch (e) { showToast('לא הצלחנו לקרוא את התמונה', 'bad'); }
}
function viewPhoto(fid) {
  const f = state.feed.find(x => x.id === fid);
  if (f && f.photo) { state.lightbox = f.photo; render(); }
}

/* ===================== אתחול ===================== */
window.addEventListener('error', e => { if (!state.booting) showToast('שגיאה: ' + (e.message || '').slice(0, 80), 'bad'); });
(async function boot() {
  try { state.seenTs = parseInt(localStorage.getItem('fitordie_seen')) || 0; } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { navigator.serviceWorker.register('./sw.js'); } catch (e) {}
  }
  Store = FIREBASE_CONFIG ? FireStore : DemoStore;
  render();
  await Store.boot();
  applyTheme();
  render();
  setTimeout(maybePostWeekSummary, 900);   // במצב ענן הנתונים אולי עוד נטענים — יש קריאה נוספת מה-listener
})();
</script>
