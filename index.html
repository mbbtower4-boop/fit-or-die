  }
  h += '<div class="tiny center" style="margin-top:16px">Fit or DIE! גרסה ' + APP_VERSION + ' 💀🔥</div>';
  return h + navHTML();
}

function netErrorHTML() {
  return splashHTML('') + '<div class="card center">לא הצלחנו לטעון את שירותי הענן 🌩️<br><span class="muted">בדקו את חיבור האינטרנט ונסו שוב</span><br><br><button class="btn primary" onclick="location.reload()">ניסיון חוזר</button></div>';
}

/* ===================== ניתוב ורינדור ===================== */
function render() {
  const v = state.view;
  document.body.dataset.view = state.booting ? 'boot' : v;   // מאפשר עיצוב פר-מסך (פריסת מחשב)
  let h;
  if (state.booting) h = splashHTML();
  else if (v === 'auth') h = authViewHTML();
  else if (v === 'join') h = joinViewHTML();
  else if (v === 'onboard') h = onboardHTML();
  else if (v === 'pickuser') h = pickUserHTML();
  else if (v === 'neterror') h = netErrorHTML();
  else if (!state.challenge || !state.members[state.me]) h = splashHTML();
  else if (v === 'checkin') h = checkinHTML();
  else if (v === 'feed') h = feedHTML();
  else if (v === 'panel') h = panelHTML();
  else if (v === 'group') h = groupHTML();
  else if (v === 'profile') h = profileHTML();
  else if (v === 'captain') h = captainHTML();
  else if (v === 'settings') h = settingsHTML();
  else h = homeHTML();
  if (state.sleepSheet) h += sleepSheetHTML();
  if (state.lightbox) h += '<div class="lightbox" onclick="state.lightbox=null;render()"><img src="' + state.lightbox + '"></div>';
  // שימור שדה קלט פעיל בין רינדורים (קריטי בצ'אט כשמגיעות הודעות תוך כדי הקלדה)
  const ae = document.activeElement;
  const keep = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.id
    ? {id: ae.id, val: ae.value, pos: ae.selectionStart} : null;
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  $('app').innerHTML = h;
  if (keep) {
    const el = $(keep.id);
    if (el) { el.value = keep.val; el.focus(); try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} }
  }
  // בפיד: גלילה לתחתית רק בכניסה/שליחה או אם המשתמש כבר קרוב לתחתית —
  // כדי שריאקציה או הודעה נכנסת לא יקפיצו מישהו שקורא היסטוריה
  if (v === 'feed' && (state.feedStick || nearBottom)) window.scrollTo(0, document.body.scrollHeight);
  state.feedStick = false;
}
function nav(v) {
  state.reactFor = null;
  if (v === 'profile') { state.profileUid = state.me; state.profWeek = null; state.measForm = false; state.editWeights = false; }
  if (v === 'checkin') state.draft = {activity: (state.draft && state.draft.activity) || 'walk', minutes: 30, note:'', photo:null};
  if (v === 'captain') state.weekDraft = null;
  if (v === 'panel') state.panelDraft = null;
  if (v === 'settings' || v === 'onboard') state.editProfile = null;
  if (v === 'feed') {
    state.feedStick = true;
    state.seenTs = Date.now();
    try { localStorage.setItem('fitordie_seen', state.seenTs); } catch (e) {}
  }
  state.view = v; render();
}
function openProfile(uid) { state.profileUid = uid; state.profWeek = null; state.measForm = false; state.editWeights = false; state.view = 'profile'; render(); }

/* ===================== פעולות ===================== */
function setAuthTab(t) { state.authTab = t; render(); }
function setJoinTab(t) { state.joinTab = t; render(); }
async function doAuth() {
  const email = $('authEmail').value.trim(), pass = $('authPass').value;
  if (!email || pass.length < 6) { showToast('נא למלא אימייל וסיסמה (6+ תווים)', 'bad'); return; }
  state.authBusy = true; render();
  try {
    if (state.authTab === 'login') await Store.signIn(email, pass);
    else await Store.signUp(email, pass);
  } catch (e) {
    const msgs = {'auth/invalid-credential':'אימייל או סיסמה שגויים', 'auth/wrong-password':'סיסמה שגויה',
      'auth/user-not-found':'לא קיים חשבון — נסו הרשמה', 'auth/email-already-in-use':'האימייל כבר רשום — נסו התחברות',
      'auth/invalid-email':'כתובת אימייל לא תקינה', 'auth/weak-password':'הסיסמה חלשה מדי'};
    showToast(msgs[e.code] || ('שגיאה: ' + e.message), 'bad');
  }
  state.authBusy = false; render();
}
async function doJoin() {
  const code = $('joinCode').value.trim();
  if (!code) { showToast('נא להזין קוד הזמנה', 'bad'); return; }
  try { await Store.joinByCode(code); } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doCreate() {
  const f = {name: $('chName').value.trim(), code: $('chCode').value.trim(),
    weeks: parseInt($('chWeeks').value) || 12, goal: parseInt($('chGoal').value) || 150};
  if (!f.name || f.code.length < 3) { showToast('נא למלא שם וקוד (3+ תווים)', 'bad'); return; }
  f.goal = Math.max(GOAL_MIN_RANGE[0], Math.min(GOAL_MIN_RANGE[1], f.goal));
  try { await Store.createChallenge(f); } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
function obSet(k, v) { (state.editProfile = state.editProfile || {})[k] = v; syncEditInputs(); render(); }
function gearSet(slot, val, lvReq) {
  const me = state.members[state.me];
  const myLv = me ? levelIndex(me.xp || 0) : 0;
  if (lvReq > myLv) { showToast('🔒 נפתח בדרגה ' + (lvReq + 1) + ' (' + LEVELS[lvReq].n + ')', 'bad'); return; }
  syncEditInputs();
  state.editProfile.gear[slot] = val;
  render();
}
function syncEditInputs() {
  const n1 = $('obName'), n2 = $('setName');
  if (n1) state.editProfile.name = n1.value;
  if (n2) state.editProfile.name = n2.value;
  const w1 = $('obW1'), w2 = $('obW2'), oa = $('obArm'), ob = $('obBelly'), ow = $('obWaist');
  if (w1) state.editProfile.startWeight = w1.value;
  if (w2) state.editProfile.goalWeight = w2.value;
  if (oa) state.editProfile.startArm = oa.value;
  if (ob) state.editProfile.startBelly = ob.value;
  if (ow) state.editProfile.startWaist = ow.value;
}
async function doOnboard() {
  syncEditInputs();
  const d = state.editProfile;
  if (!d.name.trim()) { showToast('איך קוראים לך? 🙂', 'bad'); return; }
  const priv = {}, entry = {date: dayKey()};
  if (parseFloat(d.startWeight)) { priv.startWeight = parseFloat(d.startWeight); entry.weight = priv.startWeight; }
  if (parseFloat(d.goalWeight)) priv.goalWeight = parseFloat(d.goalWeight);
  if (parseFloat(d.startArm)) { priv.startArm = parseFloat(d.startArm); entry.arm = priv.startArm; }
  if (parseFloat(d.startBelly)) { priv.startBelly = parseFloat(d.startBelly); entry.belly = priv.startBelly; }
  if (parseFloat(d.startWaist)) { priv.startWaist = parseFloat(d.startWaist); entry.waist = priv.startWaist; }
  if (Object.keys(entry).length > 1) priv.measures = [entry];   // המדידה הראשונה על ציר הזמן
  try {
    await Store.completeOnboard({name: d.name.trim(), emoji: d.emoji, color: d.color, avatar: d.avatar || 'hero'}, Object.keys(priv).length ? priv : null);
    showToast('ברוך הבא לאתגר! 🎉', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doSaveProfile() {
  syncEditInputs();
  const d = state.editProfile;
  if (!d.name.trim()) { showToast('חסר שם', 'bad'); return; }
  await Store.saveProfile({name: d.name.trim(), emoji: d.emoji, color: d.color, avatar: d.avatar || 'hero', gear: d.gear || {}});
  if (state.mode === 'demo') render();
  applyTheme(); showToast('נשמר ✔', 'gold');
}
async function doSaveChallenge() {
  const name = $('chEditName').value.trim();
  const goal = Math.max(GOAL_MIN_RANGE[0], Math.min(GOAL_MIN_RANGE[1], parseInt($('chEditGoal').value) || state.challenge.defaultGoalMin));
  const habit = $('chEditHabit').value.trim();
  const weeks = Math.max(curWeek() + 1, Math.min(52, parseInt($('chEditWeeks').value) || state.challenge.weeksTotal));
  if (!name) { showToast('חסר שם לאתגר', 'bad'); return; }
  try {
    await Store.saveChallenge({name, defaultGoalMin: goal, dailyHabit: habit, weeksTotal: weeks});
    if (state.mode === 'demo') render();
    showToast('הגדרות האתגר נשמרו ✔', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doHabit(on) {
  try {
    const res = await Store.habit(on);
    render();
    if (res.xp > 0) xpPop(res.xp);
    celebrate(res.events);
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doClaimCheat() {
  if (!confirm('לסגור את פאנל ה-CHEAT? (אחרי שחגגתם 🍕)')) return;
  try { await Store.claimCheat(); render(); showToast('שיהיה לבריאות! הספירה לצ\'יט הבא התחילה 🍕', 'gold'); }
  catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doShareInvite() {
  const url = location.origin + location.pathname;
  const txt = 'מצטרפים אליי לאתגר "' + state.challenge.name + '" ב-Fit or DIE! 💀🔥\n' + url + '\nקוד הזמנה: ' + state.challenge.code;
  try { if (navigator.share) { await navigator.share({text: txt}); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(txt); showToast('ההזמנה הועתקה — הדביקו בוואטסאפ 📋', 'gold'); }
  catch (e) { prompt('העתיקו את ההזמנה:', txt); }
}
async function doResetGroup() {
  if (!confirm('לאפס את נתוני כל הקבוצה?\nיתאפסו: נקודות, תגים, רצפים, דיווחים, הפיד והשבועות.\nיישמרו: הפרופילים ומדידות הגוף.')) return;
  if (!confirm('בטוח-בטוח? אי אפשר לבטל את זה.')) return;
  try {
    await Store.resetGroup();
    state.view = 'home'; applyTheme(); render();
    showToast('האתגר אופס — יוצאים לדרך חדשה! 🚀', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
function draftSet(k, v) { state.draft[k] = v; render(); }
function draftMin(v) { state.draft.minutes = Math.max(0, Math.min(600, v || 0)); render(); }
async function draftPhoto(inp) {
  if (!inp.files || !inp.files[0]) return;
  showToast('מכווץ תמונה... 📷');
  try { state.draft.photo = await compressImage(inp.files[0]); render(); }
  catch (e) { showToast('לא הצלחנו לקרוא את התמונה', 'bad'); }
}
async function doCheckin() {
  const d = state.draft;
  const note = $('ckNote') ? $('ckNote').value : d.note;
  if (!d.minutes || d.minutes < MIN_WORKOUT) { showToast('אימון נספר מ-' + MIN_WORKOUT + ' דקות ומעלה 💪', 'bad'); return; }
  try {
    const res = await Store.checkin({activity: d.activity, minutes: d.minutes, note, photo: d.photo, day: dayKey()});
    state.draft = null; state.view = 'home';
    applyTheme(); render();
    if (res.xp > 0) xpPop(res.xp);
    celebrate(res.events);
  } catch (e) { showToast('שגיאה בשמירה: ' + e.message, 'bad'); }
}
/* טוסטים וקונפטי לאירועי מנוע (משותף לדיווח אימון ולדיווח שינה) */
function celebrate(events) {
  events.forEach((ev, i) => setTimeout(() => {
    if (ev.t === 'badge') { const b = badgeById(ev.id); showToast(b.e + ' תג חדש: ' + b.n + '!', 'gold'); }
    if (ev.t === 'level') showToast('🎉 עלית לדרגת ' + LEVELS[ev.lv].n + '! הגיבור שלך השתדרג 🦸', 'gold');
    if (ev.t === 'bonus') showToast('⭐ ' + ev.txt, 'gold');
    if (ev.t === 'group') showToast('🏆 הקבוצה עמדה ביעד! +30 לכולם', 'gold');
    if (ev.t === 'gsleep') showToast('😴 הקבוצה עמדה ביעד השינה! +20 לכולם', 'gold');
    if (ev.t === 'shield') showToast('🛡️ מגן הרצף הציל את הרצף שלך! ייטען מחדש בעוד 14 יום', 'gold');
    if (ev.t === 'firstweek') showToast('🎬 ראשון בשטח! פתחת את השבוע +15', 'gold');
    if (ev.t === 'cheat') showToast('🍕 הקבוצה פתחה פאנל CHEAT! מגיעה לכם חגיגה', 'gold');
  }, 600 + i * 900));
  if (events.some(ev => ev.t !== 'badge')) confetti();
}
function doSleep() {
  const ws = memberWeek(state.members[state.me], curWeek());
  const prev = (ws.sleepLog || {})[dayKey()];
  state.sleepDraft = prev ? prev.h : 7.5;
  state.sleepSheet = true; render();
}
function sleepPick(v) { state.sleepDraft = v; render(); }
function closeSheet() { state.sleepSheet = false; state.lightbox = null; render(); }
function sleepSheetHTML() {
  const ws = memberWeek(state.members[state.me], curWeek());
  const prev = (ws.sleepLog || {})[dayKey()];
  const opts = [6, 6.5, 7, 7.5, 8, 8.5, 9];
  return '<div class="sheetback" onclick="closeSheet()"></div><div class="sheet">' +
    '<h2>😴 כמה ישנת הלילה?</h2>' +
    (prev ? '<div class="tiny" style="margin-bottom:6px">כבר דווח ' + prev.h + ' שע\' על הלילה — שמירה תעדכן את הדיווח</div>' : '') +
    '<div class="minrow">' + opts.map(o => '<button class="' + (parseFloat(state.sleepDraft) === o ? 'sel' : '') + '" onclick="sleepPick(' + o + ')">' + o + '</button>').join('') +
    '<input id="sleepCustom" type="number" step="0.5" min="0" max="14" inputmode="decimal" value="' + state.sleepDraft + '" onchange="state.sleepDraft=this.value"></div>' +
    '<div class="tiny" style="margin-bottom:12px">7 ומעלה = XP · 8 = מושלם (8 XP) · מעל 8 לא נספר · יעד שבועי: ' + SLEEP_WEEK_GOAL + ' שע\'</div>' +
    '<div class="row"><button class="btn primary grow" onclick="saveSleep()">שמירה 😴</button><button class="btn" onclick="closeSheet()">ביטול</button></div></div>';
}
async function saveSleep() {
  const v = parseFloat(state.sleepDraft);
  if (isNaN(v) || v <= 0 || v > 14) { showToast('ערך לא סביר 🤨', 'bad'); return; }
  state.sleepSheet = false;
  try {
    const res = await Store.sleep(v);
    render();
    if (res.xp > 0) xpPop(res.xp);
    else if (v < SLEEP_NIGHT_MIN) showToast('נרשם. מתחת ל-7 שע\' אין XP — לילה טוב הערב! 😴');
    celebrate(res.events);
  } catch (e) { showToast('שגיאה בשמירה: ' + e.message, 'bad'); }
}
async function togglePlanDay(dk) {
  if (dk < dayKey()) return;                                   // אין תכנון לאחור
  const w = curWeek(), ws = memberWeek(state.members[state.me], w);
  if ((ws.daysArr || []).includes(dk)) return;                 // כבר יום פעיל
  const plan = (ws.planDays || []).slice();
  const i = plan.indexOf(dk);
  if (i >= 0) plan.splice(i, 1); else plan.push(dk);
  try {
    await Store.setPlanDays(w, plan);
    render();
    if (i < 0) showToast('📅 מתוכנן! נתראה שם 💪');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function feedPhotoSend(inp) {
  if (!inp.files || !inp.files[0]) return;
  showToast('מכווץ תמונה... 📷');
  try {
    const data = await compressImage(inp.files[0], 1100);
    await Store.sendPhoto(data);
    if (state.mode === 'demo') render();
    showToast('שותף לקבוצה! 📸', 'gold');
  } catch (e) { showToast('לא הצלחנו לקרוא את התמונה', 'bad'); }
}
function panelHost(uid) { syncPanelInputs(); state.panelDraft.host = uid; render(); }
function syncPanelInputs() {
  const m = $('panelMotif'), w = $('panelWhen'), l = $('panelLoc');
  if (m) state.panelDraft.motif = m.value;
  if (w) state.panelDraft.when = w.value;
  if (l) state.panelDraft.location = l.value;
}
async function doPanelSave() {
  syncPanelInputs();
  const d = state.panelDraft;
  state.panelEdit = false;
  try {
    await Store.setPanel(curWeek(), {host: d.host, motif: d.motif.trim(), when: d.when.trim(), location: d.location.trim()});
    render();
    showToast('הפאנל פורסם לקבוצה! 🥗', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doBring() {
  const v = $('bringIn').value.trim();
  try {
    await Store.setBring(curWeek(), v);
    if (state.mode === 'demo') render();
    showToast(v ? 'נרשם! 🧺' : 'נמחק');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doSend() {
  const inp = $('msgIn'), text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  state.feedStick = true;
  try { await Store.sendMsg(text); if (state.mode === 'demo') render(); }
  catch (e) { showToast('ההודעה לא נשלחה: ' + e.message, 'bad'); }
}
function toggleReactPick(fid) { state.reactFor = state.reactFor === fid ? null : fid; render(); }
async function doReact(fid, ri) {
  state.reactFor = null;
  try { await Store.react(fid, ri); if (state.mode === 'demo') render(); }
  catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
function wkGoal(d) {
  const w = state.weekDraft;
  w.goalMin = Math.max(GOAL_MIN_RANGE[0], Math.min(GOAL_MIN_RANGE[1], w.goalMin + d));
  const b = $('wkBonus'); if (b) w.bonus = b.value;
  render();
}
function wkTheme(t) { state.weekDraft.theme = t; const b = $('wkBonus'); if (b) state.weekDraft.bonus = b.value; render(); }
async function doWeekPlan() {
  const d = state.weekDraft, b = $('wkBonus'), t = $('wkTitle');
  if (b) d.bonus = b.value.trim();
  if (t) d.title = t.value.trim();
  try {
    await Store.setWeekPlan(curWeek(), {goalMin: d.goalMin, theme: d.theme, bonus: d.bonus, title: d.title || '', captainUid: weekInfo(curWeek()).captainUid});
    state.view = 'home'; applyTheme(); render();
    showToast('השבוע פורסם לקבוצה! 📣', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doClaimBonus() {
  const ok = await Store.claimBonus();
  if (ok) { xpPop(20); if (state.mode === 'demo') render(); else render(); }
}
async function doMeasureInline() {
  const g = id => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
  const entry = {date: dayKey()};
  const w = g('mW'), a = g('mArm'), b = g('mBelly'), wa = g('mWaist');
  if (w != null) { if (w < 20 || w > 400) { showToast('משקל לא סביר', 'bad'); return; } entry.weight = w; }
  if (a != null) { if (a < 15 || a > 100) { showToast('היקף זרוע לא סביר', 'bad'); return; } entry.arm = a; }
  if (b != null) { if (b < 40 || b > 250) { showToast('היקף בטן לא סביר', 'bad'); return; } entry.belly = b; }
  if (wa != null) { if (wa < 40 || wa > 250) { showToast('היקף מותניים לא סביר', 'bad'); return; } entry.waist = wa; }
  if (Object.keys(entry).length === 1) { showToast('נא למלא לפחות מדידה אחת', 'bad'); return; }
  state.measForm = false;
  const me = state.members[state.me], patch = {};
  if (entry.weight != null && !me.startWeight) patch.startWeight = entry.weight;
  if (entry.arm != null && !me.startArm) patch.startArm = entry.arm;
  if (entry.belly != null && !me.startBelly) patch.startBelly = entry.belly;
  if (entry.waist != null && !me.startWaist) patch.startWaist = entry.waist;
  try {
    await Store.addMeasure(entry);
    if (Object.keys(patch).length) await Store.saveShared(patch);
    render();
    showToast('נשמר! 📏', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function doSetWeightsInline() {
  const g = id => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
  const patch = {};
  const s = g('wStart'), gl = g('wGoal'), ar = g('wArmS'), be = g('wBellyS'), wa = g('wWaistS');
  if (s != null && s >= 20 && s <= 400) patch.startWeight = s;
  if (gl != null && gl >= 20 && gl <= 400) patch.goalWeight = gl;
  if (ar != null && ar >= 15 && ar <= 100) patch.startArm = ar;
  if (be != null && be >= 40 && be <= 250) patch.startBelly = be;
  if (wa != null && wa >= 40 && wa <= 250) patch.startWaist = wa;
  if (!Object.keys(patch).length) { showToast('נא להזין ערכים', 'bad'); return; }
  state.editWeights = false;
  try {
    await Store.saveShared(patch);
    render();
    showToast('עודכן ✔', 'gold');
  } catch (e) { showToast('שגיאה: ' + e.message, 'bad'); }
}
async function sharedPhoto(inp, key) {
  if (!inp.files || !inp.files[0]) return;
  showToast('מכווץ תמונה... 📷');
  try {
    const data = await compressImage(inp.files[0], 700);
    const patch = {}; patch[key] = data;
    await Store.saveShared(patch);
    if (state.mode === 'demo') render();
  } catch (e) { showToast('לא הצלחנו לקרוא את התמונה', 'bad'); }
}
function viewPhoto(fid) {
  const f = state.feed.find(x => x.id === fid);
  if (f && f.photo) { state.lightbox = f.photo; render(); }
}

/* ===================== אתחול ===================== */
window.addEventListener('error', e => { if (!state.booting) showToast('שגיאה: ' + (e.message || '').slice(0, 80), 'bad'); });
(async function boot() {
  try { state.seenTs = parseInt(localStorage.getItem('fitordie_seen')) || 0; } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { navigator.serviceWorker.register('./sw.js'); } catch (e) {}
  }
  Store = FIREBASE_CONFIG ? FireStore : DemoStore;
  render();
  await Store.boot();
  applyTheme();
  render();
  setTimeout(maybePostWeekSummary, 900);   // במצב ענן הנתונים אולי עוד נטענים — יש קריאה נוספת מה-listener
})();
</script>
</body>
</html>
